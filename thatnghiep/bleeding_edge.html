function selectExamAns(qIdx, val, skipRender) {
  if (S.exam.run && S.exam.run.questions[qIdx]) {
    S.exam.run.questions[qIdx].userAnswer = val;
    saveExamRun();
    recordStudyAnswer();
    if (!skipRender) render(); // Chỉ render lại khi chọn trắc nghiệm/đúng sai, bỏ qua khi gõ input chữ
  }
}
function jumpExamQ(idx) {
  if (S.exam.run) { S.exam.run.currentIndex = idx; render(); }
}
function nextExamQ() {
  if (S.exam.run && S.exam.run.currentIndex < S.exam.run.questions.length - 1) { S.exam.run.currentIndex++; render(); }
}
function prevExamQ() {
  if (S.exam.run && S.exam.run.currentIndex > 0) { S.exam.run.currentIndex--; render(); }
}

function startExam() {
  const cfg = examCfg();
  const ti = document.getElementById('examTimeInput');
  if (ti) cfg.time = Math.min(180, Math.max(5, parseInt(ti.value, 10) || cfg.time || 45));
  const types = examSelectedTypes(cfg);
  if (!types.length) return;

  let pool = [];
  scopeTopics(cfg.scope).forEach(t => {
    t.questions.forEach(q => { if (types.indexOf(q.type) >= 0) pool.push({ tid: t.id, ttitle: t.title, q: q }); });
  });
  if (!pool.length) return;
  shuffle(pool);
  const target = Math.min(cfg.mode === 'full' ? 40 : 20, pool.length);

  // every selected type that exists gets at least one question, the rest is random
  const by = {};
  pool.forEach(it => { (by[it.q.type] = by[it.q.type] || []).push(it); });
  let picked = [], rest = [];
  types.forEach(t => { if (by[t]) { picked.push(by[t][0]); rest = rest.concat(by[t].slice(1)); } });
  shuffle(rest);
  picked = picked.concat(rest.slice(0, Math.max(0, target - picked.length)));

  // shuffle inside each type, then pin the type order: mcq, true/false, ... , short
  shuffle(picked);
  picked.forEach((it, i) => { it._o = i; });
  picked.sort((a, b) => (EXAM_TYPES.indexOf(a.q.type) - EXAM_TYPES.indexOf(b.q.type)) || (a._o - b._o));

  const items = picked.map(it => {
    const o = { tid: it.tid, ttitle: it.ttitle, q: it.q, userAnswer: null, flagged: false };
    if (it.q.type === 'tfs') o.userAnswer = it.q.items.map(() => null);
    else if (it.q.type === 'match') {
      o.userAnswer = {}; o.selL = -1;
      o.rorder = shuffle(it.q.pairs.map((_, i) => i));
      if (o.rorder.length > 1 && o.rorder.every((v, i) => v === i)) o.rorder.push(o.rorder.shift());
    }
    return o;
  });

  S.exam = {
    step: 'doing',
    config: cfg,
    confirmingSubmit: false,
    run: {
      questions: items,
      currentIndex: 0,
      startTime: Date.now(),
      endTime: Date.now() + cfg.time * 60 * 1000
    }
  };
  saveExamRun();
  startExamTimer();
  render();
}

function examTfsPick(qIdx, i, v) {
  const it = S.exam.run && S.exam.run.questions[qIdx];
  if (!it) return;
  if (!Array.isArray(it.userAnswer)) it.userAnswer = it.q.items.map(() => null);
  it.userAnswer[i] = it.userAnswer[i] === v ? null : v;
  saveExamRun(); render();
}
function examMatchPick(qIdx, side, idx) {
  const it = S.exam.run && S.exam.run.questions[qIdx];
  if (!it) return;
  const mp = it.userAnswer && typeof it.userAnswer === 'object' ? it.userAnswer : (it.userAnswer = {});
  let k;
  if (it.selL == null) it.selL = -1;
  if (side === 'L') {
    if (mp[idx] != null) { delete mp[idx]; it.selL = idx; }
    else it.selL = it.selL === idx ? -1 : idx;
  } else {
    let owner = -1;
    for (k in mp) if (mp[k] === idx) owner = parseInt(k, 10);
    if (it.selL < 0) { if (owner >= 0) { delete mp[owner]; it.selL = owner; } }
    else { if (owner >= 0) delete mp[owner]; mp[it.selL] = idx; it.selL = -1; }
  }
  saveExamRun(); render();
}
function examSelfGrade(idx, ok) {
  const res = S.exam.result;
  if (!res || !res.questions[idx]) return;
  res.questions[idx].selfOk = ok;
  S.exam.result = computeExamResult(res.questions, res.timeUsed);
  ndUpdateExam(S.exam.result);
  render();
}

function saveExamRun() {
  if (S.exam.run) store.set('sp:run:' + S.key, JSON.stringify(S.exam.run));
}
function resumeExam() {
  const saved = store.get('sp:run:' + S.key);
  if (saved) {
    try {
      S.exam.run = JSON.parse(saved);
      S.exam.step = 'doing';
      startExamTimer();
      render();
    } catch (e) {
      store.remove('sp:run:' + S.key);
    }
  }
}
function exitExam() {
  saveExamRun();
  S.exam.step = 'config';
  if (window._examTimerInterval) clearInterval(window._examTimerInterval);
  render();
}

function startExamTimer() {
  if (window._examTimerInterval) clearInterval(window._examTimerInterval);
  window._examTimerInterval = setInterval(() => {
    if (!S.exam.run || S.exam.step !== 'doing') { clearInterval(window._examTimerInterval); return; }
    const remaining = S.exam.run.endTime - Date.now();
    const timerEl = document.getElementById('examTimer');
    if (remaining <= 0) {
      clearInterval(window._examTimerInterval);
      submitExam();
      uiDialog({ title: tr('exam_time_h'), body: tr('examTimeUp'), ok: tr('exam_time_ok'), cancel: false });
      return;
    }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    if (timerEl) timerEl.innerText = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }, 1000);
}

let submitConfirmCount = 0;
function confirmSubmitExam() {
  if (!S.exam.confirmingSubmit) {
    S.exam.confirmingSubmit = true;
    render(); // Cập nhật lại giao diện nút bấm sang trạng thái chờ xác nhận
    
    // Tự động hủy trạng thái xác nhận sau 5 giây nếu người dùng không bấm nữa
    if (window._submitTimeout) clearTimeout(window._submitTimeout);
    window._submitTimeout = setTimeout(() => {
      if (S.exam && S.exam.confirmingSubmit) {
        S.exam.confirmingSubmit = false;
        render();
      }
    }, 5000);
  } else {
    if (window._submitTimeout) clearTimeout(window._submitTimeout);
    S.exam.confirmingSubmit = false;
    submitExam();
  }
}

function submitExam() {
  if (window._examTimerInterval) clearInterval(window._examTimerInterval);
  if (window._submitTimeout) clearTimeout(window._submitTimeout);
  const run = S.exam.run;
  if (!run) return;
  S.exam.confirmingSubmit = false;
  const used = Math.min(Date.now(), run.endTime) - run.startTime;
  S.exam.result = computeExamResult(run.questions, Math.max(0, used));
  ndRecordExam(S.exam.result);
  S.exam.filter = 'all';
  S.exam.step = 'result';
  store.remove('sp:run:' + S.key);
  recordStudyActivity(Math.max(1, Math.round(used / 60000)));
  render();
  window.scrollTo(0, 0);
}

function resetExamConfig() {
  S.exam = { step: 'config', run: null, confirmingSubmit: false, config: S.exam.config };
  render();
}

function formatTime(ms) {
  const secs = Math.floor(ms / 1000);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m} ${tr('minutes')} ${s} ${tr('seconds')}`;
}
  /* ---------- quiz ---------- */
  function stopQT() { if (S.qiv) { clearInterval(S.qiv); S.qiv = null; } }
  function armQT() {
    stopQT();
    var q = S.quiz;
    if (!q || q.done || q.phase !== 'ask' || !S.qopts.secs) return;
    q.deadline = Date.now() + S.qopts.secs * 1000;
    S.qiv = setInterval(tickQ, 200);
  }
  function tickQ() {
    var q = S.quiz;
    if (!q || q.done || q.phase !== 'ask') { stopQT(); return; }
    var left = Math.max(0, q.deadline - Date.now());
    var el = $('#qTime'), bar = $('#qBar');
    if (el) el.textContent = Math.ceil(left / 1000) + 's';
    if (bar) bar.style.width = (left / (S.qopts.secs * 1000) * 100) + '%';
    if (left <= 0) { stopQT(); timeUp(); }
  }
  function startQuiz(scope, items) {
    var given = !!items;
    if (!items) {
      items = [];
      scopeTopics(scope).forEach(function (t) {
        t.questions.forEach(function (q) { items.push({ tid: t.id, ttitle: t.title, q: q }); });
      });
      var totalN = items.length;
      if (totalN > 0) {
        if (S.qopts.mode === 'range') {
          var f = Math.max(1, Math.min(totalN, S.qopts.from || 1));
          var t = Math.max(1, Math.min(totalN, S.qopts.to || totalN));
          if (f > t) { var tmp = f; f = t; t = tmp; }
          items = items.slice(f - 1, t);
          if (S.qopts.shuffle) shuffle(items);
        } else {
          var count = totalN;
          if (S.qopts.countType === 'custom') {
            count = Math.max(1, Math.min(totalN, S.qopts.customCount || 10));
          } else if (S.qopts.count > 0 && S.qopts.count < totalN) {
            count = S.qopts.count;
          }
          if (S.qopts.shuffle) shuffle(items);
          if (count > 0 && count < items.length) items = items.slice(0, count);
        }
      }
    }
    items.forEach(function (it) {
      it.res = null; it.typed = ''; it.revealed = false; it.timedOut = false;
      it.sel = null; it.hint = false; it.mp = {}; it.selL = -1; it.rorder = null;
      if (it.q.type === 'mcq') { it.order = it.q.options.map(function (_, i) { return i; }); if (S.qopts.shuffle) shuffle(it.order); }
      else if (it.q.type === 'tfs') it.sel = it.q.items.map(function () { return null; });
      else if (it.q.type === 'match') {
        it.rorder = shuffle(it.q.pairs.map(function (_, i) { return i; }));
        if (it.rorder.length > 1 && it.rorder.every(function (v, i) { return v === i; })) it.rorder.push(it.rorder.shift());
      }
    });
    if (!items.length) return;
    S.quiz = { scope: scope, items: items, i: 0, phase: 'ask', started: Date.now(), deadline: 0, done: false, retry: given };
    armQT(); render(); focusCl();
  }
  function curItem() { return S.quiz.items[S.quiz.i]; }
  function answer(pos) {
    var q = S.quiz; if (!q || q.phase !== 'ask') return;
    var it = curItem(), t = it.q, ok = false;
    if (t.type !== 'mcq' && t.type !== 'truefalse') return;
    if (t.type === 'mcq') ok = it.order[pos] === t.answer;
    else if (t.type === 'truefalse') ok = pos === (t.answer ? 0 : 1);
    it.res = { pos: pos, correct: ok, timedOut: false };
    haptic(ok ? 'ok' : 'bad');
    recordStudyAnswer();
    announceA11y(ok ? tr('correct') : tr('notquite'));
    q.phase = 'fb'; stopQT(); render();
  }
  function timeUp() {
    var q = S.quiz; if (!q || q.phase !== 'ask') return;
    var it = curItem();
    var ty = it.q.type;
    if (ty === 'short') { it.revealed = true; it.timedOut = true; }
    else if (ty === 'tfs' || ty === 'cloze' || ty === 'match') { var cl0 = $('#cl'); if (cl0) it.typed = cl0.value; gradeItem(it, true); }
    else it.res = { pos: -1, correct: false, timedOut: true };
    q.phase = 'fb'; render();
  }
  function revealShort() {
    var q = S.quiz; if (!q || q.phase !== 'ask') return;
    var ta = $('#typed'); if (ta) curItem().typed = ta.value;
    curItem().revealed = true; q.phase = 'fb'; stopQT(); render();
  }
  function gradeShort(ok) {
    var it = curItem(); it.res = { pos: -1, correct: ok, timedOut: !!it.timedOut };
    recordStudyAnswer();
    nextQ();
  }
  /* ---------- extra question types: tfs / cloze / match ---------- */
  var TFS_SC = [0, 0.1, 0.25, 0.5, 1];
  /* 4 statements: 0 right = 0, 1 = 0.1, 2 = 0.25, 3 = 0.5, 4 = 1. A pack saved earlier with another item count is mapped onto the same scale. */
  function tfsScore(k, n) { if (!n) return 0; return TFS_SC[n === 4 ? k : Math.round(k / n * 4)]; }
  function norm1(x) { return String(x == null ? '' : x).normalize('NFC').toLowerCase().replace(/[.,;:!?"'()\[\]\u201c\u201d\u2018\u2019]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function norm2(x) { return norm1(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0111/g, 'd').replace(/\s+/g, ' ').trim(); }
  function itemScore(it) { var r = it.res; if (!r) return 0; return r.score != null ? r.score : (r.correct ? 1 : 0); }
  function fmtN(x) { return String(Math.round(x * 100) / 100); }
  function gradeItem(it, timedOut) {
    var t = it.q, r = { pos: -1, correct: false, score: 0, timedOut: !!timedOut };
    if (t.type === 'tfs') {
      var k = 0, n = t.items.length;
      t.items.forEach(function (x, i) { if (it.sel && it.sel[i] === x.answer) k++; });
      r.k = k; r.n = n; r.correct = k === n; r.score = tfsScore(k, n);
    } else if (t.type === 'cloze') {
      var n1 = norm1(it.typed), n2 = norm2(it.typed);
      var exact = !!n1 && t.answers.some(function (a) { return norm1(a) === n1; });
      var loose = !exact && !!n2 && t.answers.some(function (a) { return norm2(a) === n2; });
      r.correct = exact || loose; r.loose = loose; r.score = r.correct ? 1 : 0;
    } else if (t.type === 'match') {
      var kk = 0, nn = t.pairs.length;
      t.pairs.forEach(function (_, i) { if (it.mp[i] === i) kk++; });
      r.k = kk; r.n = nn; r.correct = kk === nn; r.score = kk / nn;
    }
    it.res = r; return r;
  }
  function submitItem() {
    var q = S.quiz; if (!q || q.phase !== 'ask') return;
    var it = curItem(), ty = it.q.type;
    if (ty !== 'tfs' && ty !== 'cloze' && ty !== 'match') return;
    var cl = $('#cl'); if (cl) it.typed = cl.value;
    gradeItem(it); haptic(it.res.correct ? 'ok' : 'bad');
    recordStudyAnswer();
    q.phase = 'fb'; stopQT(); render();
  }
  function tfsPick(el) {
    var q = S.quiz; if (!q || q.phase !== 'ask') return;
    var it = curItem(), i = parseInt(el.dataset.i, 10), v = el.dataset.v === '1';
    it.sel[i] = v;
    Array.prototype.forEach.call(el.parentNode.children, function (b) { b.classList.toggle('sel', b === el); });
  }
  function matchPick(side, idx) {
    var q = S.quiz; if (!q || q.phase !== 'ask') return;
    var it = curItem(), k;
    if (side === 'L') {
      if (it.mp[idx] != null) { delete it.mp[idx]; it.selL = idx; }
      else it.selL = it.selL === idx ? -1 : idx;
    } else {
      var owner = -1;
      for (k in it.mp) if (it.mp[k] === idx) owner = parseInt(k, 10);
      if (it.selL < 0) { if (owner >= 0) { delete it.mp[owner]; it.selL = owner; } }
      else { if (owner >= 0) delete it.mp[owner]; it.mp[it.selL] = idx; it.selL = -1; }
    }
    var box = $('#mtBox'); if (box) box.innerHTML = mtInner(it, false);
  }
  function hintText(t) {
    var a = String(t.answers[0] || '').trim(), w = a.split(/\s+/).length;
    return tr('cl_hint', { w: w, c: a.charAt(0).toUpperCase() });
  }
  function hintCloze() {
    var q = S.quiz; if (!q || q.phase !== 'ask') return;
    var it = curItem(); it.hint = true;
    var cl = $('#cl'); if (cl) it.typed = cl.value;
    var h = $('#clHint'); if (h) h.textContent = hintText(it.q);
    var b = $('#clHintBtn'); if (b) b.style.display = 'none';
  }
  function focusCl() {
    var c = $('#cl');
    if (c && !c.disabled && !(window.matchMedia && window.matchMedia('(pointer:coarse)').matches)) c.focus();
  }

  function ctxHTML(t) {
    var body = t.type === 'tfs' ? (t.quote || t.context) : (t.context || t.quote);
    return '<blockquote class="ctx"><p>' + rich(body) + '</p>' + (t.source ? '<cite>' + esc(t.source) + '</cite>' : '') + '</blockquote>';
  }
  function tfLabel(b) { return tr(b ? 'tf_true' : 'tf_false'); }
  function tfsBody(it, fb) {
    var t = it.q, h = '<div class="tfs">';
    if (!fb) h += '<p class="muted">' + tr('tfs_hint') + '</p>';
    t.items.forEach(function (x, i) {
      var v = it.sel ? it.sel[i] : null;
      h += '<div class="tfi"><p>' + String.fromCharCode(97 + i) + ') ' + rich(x.text) + '</p><div class="tfb">';

    navigator.serviceWorker.register('sw.js').then(function (reg) {

      // Cache ngay trang hiện tại để lần sau mở offline được
      return navigator.serviceWorker.ready.then(function (r) {
        if (r.active) r.active.postMessage({ type: 'CACHE_URLS', urls: [location.href.split('#')[0]] });
      });
    }).catch(function (err) {
      console.log('Service Worker registration failed:', err);
    });
  });
}
</script>
</body></html>
