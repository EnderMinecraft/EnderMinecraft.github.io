<title>Sloppy Slop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>

/* Layout: sticky top bar (language, theme, focus timer); below it a topic rail on the left and one working column. A fixed sky sits behind the page: a sun with drifting clouds by day, a crescent moon with twinkling stars by night. Marker-yellow underlines flag key terms, like a highlighter on a printed handout. */
:root {
  --bg: #F2F5E9; --surface: #FFFFFF; --ink: #14251A; --muted: #566559; --line: #D8DFCB; --soft: #E5EDD6;
  --accent: darkgreen; --accent-ink: #FFFFFF; --mark: #FFE15A;
  --good: #17784F; --good-bg: #DCF1E3; --warn: #9A5B00; --warn-bg: #FBEBCB; --bad: #B8362B; --bad-bg: #F9DEDA;
  --sun-ink: #C77D00; --moon-ink: #C9D3FF;
  --sun-glow: rgb(255 206 84 / 0.4); --moon-glow: rgb(132 153 255 / 0.2);
  --beam: rgb(255 208 80 / 0.14); --cloud: #FFFFFF; --cloud-shadow: rgb(40 90 50 / 0.1);
  --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-read: 'Lora', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1222; --surface: #141C32; --ink: #E6EAF7; --muted: #93A0C3; --line: #26304D; --soft: #1B2542;
    --accent: #8499FF; --accent-ink: #0C1222; --mark: #6F5F0E;
    --good: #4CCB9F; --good-bg: #12362D; --warn: #E8AE4B; --warn-bg: #3A2D12; --bad: #F2857A; --bad-bg: #3D1F24;
    --sun-ink: #C77D00; --moon-ink: #C9D3FF;
    --sun-glow: rgb(255 206 84 / 0.4); --moon-glow: rgb(132 153 255 / 0.2);
    --beam: rgb(255 208 80 / 0.14); --cloud: #FFFFFF; --cloud-shadow: rgb(40 90 50 / 0.1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1222; --surface: #141C32; --ink: #E6EAF7; --muted: #93A0C3; --line: #26304D; --soft: #1B2542;
  --accent: #8499FF; --accent-ink: #0C1222; --mark: #6F5F0E;
  --good: #4CCB9F; --good-bg: #12362D; --warn: #E8AE4B; --warn-bg: #3A2D12; --bad: #F2857A; --bad-bg: #3D1F24;
  --sun-ink: #C77D00; --moon-ink: #C9D3FF;
  --sun-glow: rgb(255 206 84 / 0.4); --moon-glow: rgb(132 153 255 / 0.2);
  --beam: rgb(255 208 80 / 0.14); --cloud: #FFFFFF; --cloud-shadow: rgb(40 90 50 / 0.1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.15; text-wrap: balance; letter-spacing: -0.02em; }
::selection {
  background-color: var(--accent);
  color: var(--accent-ink);
}
p { margin: 0; }
.muted { color: var(--muted); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: linear-gradient(to top, var(--mark) 0 48%, transparent 48%); color: inherit; padding: 0 0.1em; }
.scroll { overflow-x: auto; }
/* =========================================================
   WEBKIT / IOS 16 COMPATIBILITY FIXES
   ========================================================= */

/* 1. Sửa lỗi đè chữ (Overlap) do Flex/Grid auto-rows trên WebKit cũ */
.prog {
  display: flex !important;
  flex-direction: column !important;
  align-items: stretch !important;
  gap: 16px !important;
}

@media (min-width: 861px) {
  .prog {
    flex-direction: row !important;
    align-items: center !important;
    gap: 28px !important;
  }
}

/* 2. Cố định bounding-box cho thẻ số lớn .big để tránh đè văn bản bên dưới */
.big {
  line-height: 1.1 !important;
  display: block !important;
  margin-bottom: 6px !important;
  /* Ép WebKit tính toán lại chiều cao chữ chính xác */
  height: auto !important;
  min-height: 1em !important;
}

.big span {
  display: inline-block !important;
  vertical-align: baseline !important;
}

/* 3. Sửa lỗi dính chữ/vỡ dòng trên Safari di động */
.lede, .m-l, .m-v, .prog p {
  -webkit-text-size-adjust: 100%;
  word-break: break-word;
  overflow-wrap: anywhere;
}

/* 4. Fix lỗi hiển thị hẹp khối chứa chữ số trên WebKit Mobile */
.prog > div:first-child {
  flex: none !important;
  min-width: fit-content;
}

.prog > div:last-child {
  flex: 1 1 auto !important;
  min-width: 0;
}
/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
@supports (background: color-mix(in srgb, red 50%, transparent)) {
  .top { background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
}
#app { position: relative; z-index: 1; }
.logo-bg { fill: var(--ink); }
.logo-lines { stroke: var(--bg); }
.logo-mark { fill: var(--mark); }
.tools { display: flex; align-items: center; gap: 10px; flex: none; }
.seg.seg-3 { 
  grid-template-columns: repeat(3, 1fr); 
  width: 116px;
}
.seg.seg-3::before { 
  width: calc(33.333% - 2px); 
  transform: translateX(0); 
}
.seg.seg-3[data-theme-mode="dark"]::before { transform: translateX(100%); }
.seg.seg-3[data-theme-mode="system"]::before { transform: translateX(200%); }
.seg.seg-3 button { 
  padding: 0; 
  display: grid; 
  place-items: center; 
  color: var(--muted); 
}
.seg.seg-3 button svg { width: 15px; height: 15px; }
.seg.seg-3 button[aria-pressed="true"] { color: var(--ink); }
.seg { 
  position: relative; 
  display: inline-grid; 
  grid-template-columns: 1fr 1fr; 
  height: 36px; 
  padding: 2px; 
  border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); 
  border-radius: 999px; 
  background: color-mix(in srgb, var(--soft) 50%, var(--surface)); 
  box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.04);
}
.seg::before { 
  content: ""; 
  position: absolute; 
  top: 2px; 
  bottom: 2px; 
  left: 2px; 
  width: calc(50% - 2px); 
  border-radius: 999px; 
  background: var(--surface); 
  box-shadow: 0 2px 6px rgb(0 0 0 / 0.08), 0 1px 2px rgb(0 0 0 / 0.04);
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1) !important; 
}
.seg[data-lang="en"]::before { transform: translateX(100%); }
.seg button { 
  position: relative; 
  z-index: 1; 
  border: 0; 
  background: none; 
  padding: 0 12px; 
  border-radius: 999px; 
  font: 600 12px var(--font-mono); 
  letter-spacing: 0.06em; 
  color: var(--muted); 
  transition: color 0.2s ease; 
}
.seg button[aria-pressed="true"] { color: var(--ink); }
.tbtn { 
  position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; overflow: hidden; padding: 0; 
  transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s cubic-bezier(0.25, 1, 0.5, 1) !important;
}
.tbtn:hover { border-color: var(--accent); }
.tbtn:active { transform: scale(0.93); }
.tbtn svg { grid-area: 1 / 1; width: 22px; height: 22px; transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.45s ease !important; }
.ti-sun { color: var(--sun-ink); }
.ti-moon { color: var(--moon-ink); transform: rotate(-110deg) scale(0.2); opacity: 0; }
.tbtn[data-dark="true"] .ti-sun { transform: rotate(110deg) scale(0.2); opacity: 0; }
.tbtn[data-dark="true"] .ti-moon { transform: none; opacity: 1; }
.tbtn[data-dark="true"] { background: var(--soft); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; padding: 6px 0; text-align: left; }
.brand b { font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand .pn { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 36ch; padding-left: 10px; border-left: 1px solid var(--line); }
.timer-wrap { position: relative; flex: none; }
.chip { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chip svg { width: 26px; height: 26px; transform: rotate(-90deg); }
.chip .trk { 
  stroke: var(--line); 
  fill: none; 
  transition: stroke 0.4s ease; /* Smooth snap to new theme stroke without muddy intermediate phases */
}
.chip .prg { 
  stroke: var(--accent); 
  fill: none; 
  stroke-linecap: round; 
  transition: stroke-dashoffset 0.3s linear, stroke 0.4s ease; 
}
.chip.on { border-color: var(--accent); }
.chip[data-mode="break"] .prg { stroke: var(--warn); }
.chip.alert { animation: pulse 1.2s ease-in-out infinite; }
#chipText { font: 500 15px var(--font-mono); font-variant-numeric: tabular-nums; }
.chip small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px var(--soft); } }

#timerPanel { 
  position: absolute; 
  right: 0; 
  top: calc(100% + 10px); 
  width: min(340px, calc(100vw - 32px)); 
  background: var(--surface); 
  border: 1px solid var(--line); 
  border-radius: 14px; 
  padding: 18px; 
  box-shadow: 0 14px 34px rgb(10 20 50 / 0.18); 
  display: grid; 
  gap: 14px; 

  /* Apple Popover Entry/Exit Animation States */
  opacity: 0;
  transform: translateY(-6px) scale(0.97);
  transform-origin: top right; /* Expands outward from the timer button */
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
              transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
              visibility 0.2s ease;
}

#timerPanel.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  visibility: visible;
  pointer-events: auto;
}
.t-head { display: flex; justify-content: space-between; align-items: baseline; }
.eyebrow { font: 500 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
#tBig { font: 500 60px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; text-align: center; padding-block: 4px; }
.t-btns { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { 
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 13px; 
  transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
}
.pill:hover { border-color: var(--accent); }
.pill:active { transform: scale(0.96); }
.t-custom { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.t-custom label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.t-custom input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: 500 15px var(--font-mono); }
#tStats { font-size: 13px; color: var(--muted); }
#tMsg { font-size: 14px; background: var(--good-bg); color: var(--ink); border-radius: 8px; padding: 9px 11px; }

/* buttons */
.btn { 
  display: inline-flex; 
  align-items: center; 
  justify-content: center; 
  gap: 8px; 
  border: 1px solid var(--line); 
  background: var(--surface); 
  border-radius: 9px; 
  padding: 9px 16px; 
  font-weight: 600; 
  /* Smooth deceleration curve: fast start, soft stop with zero overshoot */
  transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease;
}
.btn:hover { 
  border-color: var(--accent); 
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.04); /* Soft, natural elevation shadow */
}
.btn:active { 
  transform: scale(0.97); /* Weighted physical depression feel */
  box-shadow: none;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { 
  filter: brightness(1.05); 
  box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 25%, transparent); 
}
.btn.primary:active { 
  transform: scale(0.97); 
  filter: brightness(0.95); 
  box-shadow: none; 
}
.btn.again { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: 0.5; cursor: default; transform: none !important; box-shadow: none !important; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

/* shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; padding-block: 28px 72px; align-items: start; }
.rail { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow: auto; }
.rail-h { margin: 18px 10px 6px; font: 500 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.rail-list { display: flex; flex-direction: column; gap: 2px; }
.nav-i { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--ink); }
.nav-i:hover { background: var(--soft); }
.nav-i.cur { background: var(--ink); color: var(--bg); font-weight: 600; }
.dot { flex: none; width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5.5px); mask: radial-gradient(circle, transparent 4.5px, #000 5.5px); }
.nav-i.cur .dot { background: conic-gradient(var(--bg) calc(var(--p) * 1%), color-mix(in srgb, var(--bg) 28%, transparent) 0); }
.main { min-width: 0; }

.page-h { font-size: clamp(27px, 4.4vw, 42px); margin: 10px 0 8px; }
.lede { color: var(--muted); max-width: 62ch; }
.tag { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; background: var(--mark); color: var(--ink); padding: 3px 6px; border-radius: 4px; margin-left: 6px; }
.note { margin-top: 16px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface); max-width: 70ch; }
.note details summary { cursor: pointer; font-weight: 600; }
.note ul { margin: 8px 0 0; padding-left: 1.2em; color: var(--muted); }
.main > .note { max-width: none; } /* overview notes match .streak-card / .prog width */
.note.err { border-style: solid; border-color: var(--bad); background: var(--bad-bg); }

/* overview */
.prog { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; margin-top: 24px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.big { font: 700 68px/1 var(--font-ui); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.big span { font-size: 30px; color: var(--muted); letter-spacing: 0; }
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 14px 0 16px; }
.stats div { display: grid; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sec-h { margin: 34px 0 12px; font-size: 20px; }
.tlist { display: grid; gap: 8px; }
.trow { 
  display: grid; 
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); 
  gap: 16px; 
  width: 100%; 
  text-align: left; 
  background: var(--surface); 
  border: 1px solid var(--line); 
  border-radius: 12px; 
  padding: 14px 16px; 
  align-items: center; 
  /* Smooth, weight-based transition */
  transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease, border-color 0.2s ease;
}

.trow:hover { 
  border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.05); /* Soft ambient macOS shadow */
}
.trow h3 { font-size: 17px; margin-bottom: 3px; }
.trow p { color: var(--muted); font-size: 13.5px; display: -webkit-box; line-clamp: 2; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meters { display: grid; gap: 7px; }
.m { display: grid; grid-template-columns: 62px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 12px; }
.m-l { color: var(--muted); }
.m-b { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.m-b i { display: block; height: 100%; background: var(--accent); }
.m-v { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.m.na .m-v { color: var(--muted); }
.foot { margin-top: 28px; font-size: 13px; color: var(--muted); }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 20px 0 24px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* notes */
.notes { max-width: 68ch; }
.notes .sum { font: 19px/1.55 var(--font-read); color: var(--muted); margin-bottom: 8px; }
.notes h3 { font-size: 19px; margin: 30px 0 10px; }
.notes ul { margin: 0; padding-left: 1.2em; font: 17px/1.65 var(--font-read); }
.notes li + li { margin-top: 8px; }
.terms { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 10px 22px; margin: 0; max-width: 68ch; }
.terms dt { font-weight: 700; }
.terms dd { margin: 0; font: 16px/1.55 var(--font-read); }
.done-row { margin-top: 32px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* flashcards */
.deck { display: grid; gap: 16px; max-width: 640px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 14px; }
.ctrl label { display: inline-flex; gap: 8px; align-items: center; }
.ctrl .sp { margin-left: auto; }
.prog-line { display: flex; justify-content: space-between; font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.card-wrap { perspective: 1200px; }
.card { width: 100%; cursor: pointer; }
.inner { display: grid; transition: transform 0.45s; transform-style: preserve-3d; }
.card.flipped .inner { transform: rotateY(180deg); }
.face { 
  grid-area: 1 / 1; 
  backface-visibility: hidden; 
  -webkit-backface-visibility: hidden; 
  min-height: 250px; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center; 
  gap: 12px; 
  padding: 28px; 
  background: var(--surface); 
  border: 1px solid var(--line); 
  border-radius: 16px; 
  font: 600 clamp(19px, 3.4vw, 24px) / 1.35 var(--font-ui); 
  text-align: center; 
  overflow-wrap: anywhere;
  box-shadow: 0 4px 16px rgb(0 0 0 / 0.03);
}
.face.back { transform: rotateY(180deg); background: var(--soft); }
.face small { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.hint { text-align: center; color: var(--muted); font-size: 13px; }
.rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rate .btn { padding: 13px; }
.empty { padding: 36px 20px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; display: grid; gap: 12px; justify-items: center; }

/* quiz */
.qset { display: grid; gap: 16px; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.qset label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
.qset select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.qset .chk { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.quiz { max-width: 720px; display: grid; gap: 16px; }
.q-top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font: 500 13px var(--font-mono); color: var(--muted); }
.q-top .grow { flex: 1; }
.qtimer { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.qtimer .bar { width: 90px; height: 6px; }
.qtimer .bar i { background: var(--warn); transition: width 0.2s linear; }
.q-prog { display: flex; gap: 3px; }
.q-prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.q-prog i.d { background: var(--accent); }
.q-prog i.w { background: var(--bad); }
.q-p { font-size: clamp(20px, 3.4vw, 26px); line-height: 1.3; letter-spacing: -0.01em; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { font: 500 12px var(--font-mono); width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.opt .lab { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.ok .lab { color: var(--good); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .lab { color: var(--bad); }
.typed { width: 100%; min-height: 96px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); resize: vertical; }
.fb { display: grid; gap: 10px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.fb.ok { border-color: var(--good); }
.fb.bad { border-color: var(--bad); }
.fb h3 { font-size: 16px; }
.fb.ok h3 { color: var(--good); }
.fb.bad h3 { color: var(--bad); }
.ctx { margin: 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 10px 10px 0; display: grid; gap: 6px; }
.ctx p { white-space: pre-line; font-size: 15px; line-height: 1.55; }
.ctx cite { font-size: 13px; color: var(--muted); font-style: normal; }
.tfs { display: grid; gap: 10px; }
.tfi { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.tfi p { line-height: 1.45; }
.tfb { display: flex; gap: 8px; }
.tfo { flex: 1; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: inherit; font-weight: 600; cursor: pointer; }
.tfo:hover:not(:disabled) { border-color: var(--accent); }
.tfo.sel { border-color: var(--accent); background: var(--soft); }
.tfo.ok { border-color: var(--good); background: var(--good-bg); }
.tfo.bad { border-color: var(--bad); background: var(--bad-bg); }
.tfo:disabled { cursor: default; }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 2px solid var(--accent); margin: 0 2px; }
.clin { min-height: 46px; height: 46px; resize: none; }
.clin.ok { border-color: var(--good); background: var(--good-bg); }
.clin.bad { border-color: var(--bad); background: var(--bad-bg); }
.mt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.mtc { display: grid; gap: 8px; align-content: start; }
.mtb { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: inherit; cursor: pointer; overflow-wrap: anywhere; }
.mtb .k { font: 600 12px var(--font-mono); width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.mtb.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.mtb.paired { background: var(--soft); }
.mtb.paired .k { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mtr { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow-wrap: anywhere; }
.mtr.ok { border-color: var(--good); background: var(--good-bg); }
.mtr.bad { border-color: var(--bad); background: var(--bad-bg); }
.mtr small { color: var(--muted); }
.res-i p { white-space: pre-line; }
.model { font: 16px/1.55 var(--font-read); padding: 10px 12px; background: var(--soft); border-radius: 8px; }
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score .big { font-size: 72px; }
.res-list { display: grid; gap: 10px; margin-top: 8px; }
.res-i { padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); display: grid; gap: 6px; }
.res-i p { font-size: 14px; color: var(--muted); }
.by { display: grid; gap: 6px; max-width: 520px; }

/* load + teacher */
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 34px 20px; text-align: center; background: var(--surface); display: grid; gap: 12px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--soft); }
.narrow { max-width: 720px; display: grid; gap: 22px; margin-top: 22px; }
.paste { width: 100%; min-height: 130px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); font: 13px/1.5 var(--font-mono); resize: vertical; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; max-width: 70ch; }
pre.prompt { margin: 0; max-height: 380px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.6 var(--font-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
table.f { border-collapse: collapse; min-width: 560px; width: 100%; font-size: 14px; background: var(--surface); }
table.f th, table.f td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.f th { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
table.f code { font-family: var(--font-mono); font-size: 13px; }
/* AI Assistant Quick Launcher Styles */
.ai-tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
.ai-btn { 
  display: flex; 
  align-items: center; 
  gap: 10px; 
  padding: 10px 14px; 
  border: 1px solid var(--line); 
  border-radius: 10px; 
  background: var(--surface); 
  font-weight: 600; 
  font-size: 13px; 
  text-decoration: none; 
  color: var(--ink); 
  transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
}
.ai-btn:hover { border-color: var(--accent); background: var(--soft); transform: translateY(-1px); }
.ai-btn:active { transform: scale(0.97); }
.ai-btn svg { width: 20px; height: 20px; flex: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 168px minmax(0, 1fr); gap: 20px; padding-block: 16px 56px; }
  .rail { top: calc(70px + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - 84px); }
  .rail-h { margin: 14px 8px 6px; }
  .trow { grid-template-columns: minmax(0, 1fr); }
  .prog { grid-template-columns: minmax(0, 1fr); gap: 16px; }
}
@media (max-width: 560px) {
  .brand .pn { display: none; }
  .chip small { display: none; }
  .terms { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .terms dd { margin-bottom: 10px; }
  .big { font-size: 56px; }
}
@media (max-width: 480px) {
  .brand b { display: none; }
  .tools { gap: 8px; }
  .seg button { padding: 0 10px; }
}

/* sky: sun and moon ride opposite ends of one rotating arm, so switching theme sets one and raises the other */
.sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; --R: min(78vh, 700px); --s: 132px; }
.wash { position: absolute; inset: 0; transition: opacity 1.1s ease !important; }
.wash.sun { background: radial-gradient(70vmax 55vmax at 92% 2%, var(--sun-glow), transparent 62%); }
.wash.moon { background: radial-gradient(70vmax 55vmax at 92% 2%, var(--moon-glow), transparent 62%); opacity: 0; }
.sky.dark .wash.sun { opacity: 0; }
.sky.dark .wash.moon { opacity: 1; }

.orbit { 
  position: absolute; 
  right: max(6vw, 84px); 
  top: calc(128px + var(--R)); 
  width: 0; 
  height: 0; 
  transform: rotate(var(--deg, 0deg)); /* Driven by dynamic JS variable */
}

.orb { 
  position: absolute; 
  width: var(--s); 
  height: var(--s); 
  left: calc(var(--s) / -2); 
  top: calc(var(--s) / -2); 
}

.orb svg { 
  width: 100%; 
  height: 100%; 
  overflow: visible; 
  animation: bob 8s ease-in-out infinite; 
}

/* Counter-rotate the sun and moon so they stay upright */
.orb.sun { 
  transform: translateY(calc(-1 * var(--R))) rotate(calc(-1 * var(--deg, 0deg))); 
}

.orb.moon { 
  transform: translateY(var(--R)) rotate(calc(-1 * var(--deg, 0deg))); 
}

/* Remove the old .sky.dark .orbit / .orb rules since rotation is now handled by --deg */

.sky.ready .orbit, .sky.ready .orb { 
  transition: transform 1.5s cubic-bezier(0.6, 0, 0.3, 1) !important; 
}
.rays { animation: spin 50s linear infinite; transform-origin: 0 0; }
.beams { position: absolute; left: 50%; top: 50%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%; background: repeating-conic-gradient(var(--beam) 0 5deg, transparent 5deg 20deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 66%); mask: radial-gradient(circle, #000 0, transparent 66%); animation: spin 180s linear infinite; }

.clouds { position: absolute; inset: 0; transition: opacity 1s ease !important; }
.sky.dark .clouds { opacity: 0; }
.cloud { position: absolute; opacity: 0.85; filter: drop-shadow(0 8px 12px var(--cloud-shadow)); animation: drift 90s ease-in-out infinite alternate; }
.cloud.c1 { width: 200px; top: 22%; left: 4%; }
.cloud.c2 { width: 150px; top: 52%; right: 6%; animation-duration: 120s; animation-delay: -30s; opacity: 0.7; }
.cloud.c3 { width: 270px; top: 76%; left: 28%; animation-duration: 140s; animation-delay: -60s; opacity: 0.6; }

.stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease 0.35s !important; }
.sky.dark .stars { opacity: 1; }
.stars i { position: absolute; border-radius: 50%; background: #DDE4FF; opacity: 0.35; animation: twinkle var(--d, 4s) ease-in-out infinite; animation-delay: var(--dl, 0s); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes drift { to { transform: translateX(7vw); } }
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 6px rgba(255, 255, 255, 0.8); }
}
.face, .trow {
  position: relative;
  overflow: hidden;
}

.face::after, .trow::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    350px circle at var(--mouse-x, -500px) var(--mouse-y, -500px),
    var(--accent),
    transparent 70%
  );
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
  mix-blend-mode: overlay; /* Blends smoothly with background and text */
}

.face:hover::after, .trow:hover::after {
  opacity: 0.35; /* Controls the intensity of the glow */
}

::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: 0.3s;
  animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
}

.main { 
  min-width: 0; 
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1), transform 0.2s cubic-bezier(0.25, 1, 0.5, 1); 
}
.main.is-switching {
  opacity: 0;
  transform: translateY(6px); /* Soft micro-slide down on exit, up on entry */
}
/* Optimize text and card elements for smooth language transition animations */
.page-h, .face, .tab, .nav-i span, .btn, .eyebrow, .brand b, .lede {
  will-change: opacity, transform;
}
/* colour change when the theme switches */
:root.theme-anim *, :root.theme-anim *::before, :root.theme-anim *::after {
  transition: background-color 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
}

/* Fast, crisp text, icon, and stroke transitions to prevent muddy mid-tone blending */
:root.theme-anim span, 
:root.theme-anim p, 
:root.theme-anim h1, 
:root.theme-anim h2, 
:root.theme-anim h3, 
:root.theme-anim button, 
:root.theme-anim svg *, 
:root.theme-anim .chip .trk, 
:root.theme-anim .chip .prg {
  transition: color 0.2s ease, fill 0.2s ease, stroke 0.2s ease !important;
}

/* Ensure the timer ring strokes transition smoothly */
.chip .trk, .chip .prg {
  transition: stroke-dashoffset 0.3s linear, stroke 0.6s ease;
}
.tab-content {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.22s cubic-bezier(0.25, 1, 0.5, 1), transform 0.22s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: opacity, transform;
}
.tab-content.is-switching {
  opacity: 0;
  transform: translateY(6px);
}
.streak-card { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  background: var(--surface); 
  border: 1px solid var(--line); 
  border-radius: 14px; 
  padding: 16px 20px; 
  margin-bottom: 20px; 
  gap: 16px;
}
.top-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; margin-bottom: 20px; }
.top-row > .streak-card, .top-row > .dl-card { margin-bottom: 0; min-width: 0; flex-wrap: wrap; }
.top-row .heatmap-container { align-items: flex-start; }
.top-row .heatmap { justify-content: flex-start; max-width: 100%; }
.dl-card { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; margin-bottom: 20px; }
.dl-info { display: flex; align-items: center; gap: 14px; }
.dl-icon { font-size: 24px; }
.dl-num { font: 700 24px var(--font-mono); color: var(--accent); letter-spacing: -0.02em; }
.dl-num.urgent { color: #D2493B; }
.dl-label { font-size: 13px; color: var(--muted); }
.dl-ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dl-ctrl input[type=date] { font: 500 13px var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.streak-info { display: flex; align-items: center; gap: 14px; }
.streak-icon { font-size: 24px; }
.streak-num { font: 700 24px var(--font-mono); color: var(--accent); letter-spacing: -0.02em; }
.streak-label { font-size: 13px; color: var(--muted); }

.heatmap-container { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.heatmap-toggle { 
  font: 500 11px var(--font-mono); 
  color: var(--muted); 
  background: var(--bg); 
  border: 1px solid var(--line); 
  border-radius: 999px; 
  padding: 2px 8px; 
  cursor: pointer; 
  transition: border-color 0.2s ease, color 0.2s ease; 
}
.heatmap-toggle:hover { border-color: var(--accent); color: var(--ink); }

.heatmap { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; max-width: 250px; justify-content: flex-end; }
.heatmap-cell { width: 12px; height: 12px; border-radius: 3px; background: var(--line); transition: background 0.2s ease; }
.heatmap-cell.lvl-1 { background: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.heatmap-cell.lvl-2 { background: color-mix(in srgb, var(--accent) 70%, var(--line)); }
.heatmap-cell.lvl-3 { background: var(--accent); }

/* Celebration Pop Animation */
@keyframes celebrate {
  0% { transform: scale(0.85); opacity: 0; }
  50% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.celebrate { 
  animation: celebrate 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; 
  transform-origin: center center;
}

/* Leitner Box Badges in Flashcards */
.box-badge { font: 500 11px var(--font-mono); padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); margin-bottom: 6px; }
/* Brand Wrap & Debug Popup Styles */
.brand-wrap { position: relative; display: flex; align-items: center; min-width: 0; }
.debug-popup {
  position: absolute; 
  left: 0; 
  top: calc(100% + 10px); 
  width: 300px; 
  background: var(--surface); 
  border: 1px solid var(--line); 
  border-radius: 14px; 
  padding: 16px; 
  box-shadow: 0 14px 34px rgb(10 20 50 / 0.18); 
  
  /* Apple Popover Animation States */
  opacity: 0;
  transform: translateY(-6px) scale(0.97);
  transform-origin: top left;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
              transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
              visibility 0.2s ease;
  z-index: 40;
  font-size: 13px;
  color: var(--ink);
  text-align: left;
}
.debug-popup.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  visibility: visible;
  pointer-events: auto;
}

.debug-row { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--font-mono); font-size: 11.5px; }
/* Allow text and icons to fade smoothly via opacity rather than bleeding colors */
:root.theme-anim span, :root.theme-anim svg *, :root.theme-anim button {
  transition: opacity 0.4s ease !important;
}
@media (max-width: 860px) {
  .sky { --s: 92px; }
  .orbit { right: 58px; top: calc(112px + var(--R)); }
  .cloud.c2 { display: none; }
}


/* ---------- collapsible sidebar + long-press brand ---------- */
.brand { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
.brand.pressing svg { transform: scale(.92); transition: transform .5s ease-out; }
.shell.rail-off { grid-template-columns: minmax(0, 1fr); }
.shell.rail-off .rail { display: none; }

/* ---------- make-a-pack / open-pack mobile fix ---------- */
.narrow { grid-template-columns: minmax(0, 1fr); }
.narrow > * { min-width: 0; }
.steps li, .steps code, .lede, .note { overflow-wrap: anywhere; }
.steps code { word-break: break-all; }
.ai-btn { min-width: 0; }
.ai-btn span { min-width: 0; overflow-wrap: anywhere; }
.scroll { -webkit-overflow-scrolling: touch; }
.row-btns .btn { white-space: normal; text-align: center; }

/* ---------- flashcard swipe ---------- */
.card-wrap { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.card { will-change: transform; -webkit-tap-highlight-color: transparent; }
.card.dragging { transition: none !important; cursor: grabbing; }
.card.fly { transition: transform .22s cubic-bezier(.4,0,.6,1), opacity .22s ease !important; opacity: 0; }
.card.snap { transition: transform .25s cubic-bezier(.25,1,.5,1) !important; }
.swipe-tag { position: absolute; z-index: 3; top: 14px; padding: 6px 12px; border-radius: 999px; font: 700 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; opacity: 0; pointer-events: none; border: 2px solid currentColor; background: var(--surface); }
.swipe-tag.t-right { left: 14px; color: var(--good); }
.swipe-tag.t-left { right: 14px; color: var(--warn); }
.swipe-tag.t-up { left: 50%; transform: translateX(-50%); color: var(--accent); }
.swipe-tag.t-down { left: 50%; top: auto; bottom: 14px; transform: translateX(-50%); color: var(--muted); }
.nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nav-row .btn { padding: 10px; font-size: 14px; }
.nav-row .btn svg { width: 16px; height: 16px; flex: none; }
@media (max-width: 560px) { .nav-row .btn { min-height: 44px; } }

.rp-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 20px; }
.rp-list { display: grid; gap: 8px; margin-top: 10px; }
.rp-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.rp-info { min-width: 0; flex: 1 1 160px; }
.rp-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.rail, .tabs { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.rail::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }
.brand-wrap { flex: 0 1 auto; }
.brand svg { flex: none; }
.tools { min-width: 0; }
.debug-popup { max-width: calc(100vw - 24px); }

/* Mouse glow card */
.exam-card {
  position: relative;
  overflow: hidden;
}
.exam-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    350px circle at var(--mouse-x, -500px) var(--mouse-y, -500px),
    var(--accent),
    transparent 70%
  );
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
  mix-blend-mode: overlay;
}
.exam-card:hover::after {
  opacity: 0.35;
}


/* exam review rows */
.rv-stack { display: grid; gap: 6px; }
.rv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; color: var(--ink); overflow-wrap: anywhere; white-space: pre-line; }

.rv-row.ok small { color: var(--good); }
.rv-row.bad { border-color: var(--bad); background: var(--bad-bg); }

/* Microinteractions Grid */
.exam-jump-container {
  display: grid;

  max-height: 280px;
  overflow-y: auto;
  padding: 6px;

}
.exam-jump-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
}
.exam-jump-btn:active {

}
/* Custom Dropdown UI */
.c-select {
  position: relative;
  width: 100%;
}
.c-select-btn {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);

  color: var(--ink);

  justify-content: space-between;

  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;

.c-select-btn:hover {
  border-color: var(--accent);
}
.c-select-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  z-index: 100;
  display: none;
  max-height: 220px;

  padding: 4px;

.c-select.open .c-select-menu {
  display: block;
}
.c-select-item {
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.15s;
}
.c-select-item:hover {
  background: var(--soft);
  color: var(--accent);
}
.c-select-item.kb-focus {
  background: var(--soft);
  color: var(--accent);
}
.c-select-item.selected {
  background: var(--accent);
  color: #fff;
  font-weight: 600;

<script type="text/plain" id="promptText">
You convert a teacher's Word document into a "Study Pack": one JSON file that a revision website loads. Follow every rule exactly so the output has the same shape every time.

OUTPUT RULES
1. Reply with one JSON object and nothing else. No introduction, no explanation, no Markdown code fence.
2. The JSON must be valid: double quotes around every key and string, no trailing commas, no comments. Escape a double quote inside a string as \" and avoid line breaks inside strings.
3. Use only information found in the document. Never add facts, dates, formulas or examples that are not in it. If the document has too little material for a target below, produce fewer items. Do not invent filler.
4. Write the content in the same language as the document. Keep every field name and every "type" value in English, exactly as shown.
5. If you would run out of space, stop adding topics and close the JSON properly. A shorter valid file is better than a long broken one. Only include complete topics.

FIELD GUIDE
Top level:
- "format": always "studypack".
- "version": always 1.
- "title", "subject", "level", "language": strings. Use "" when unknown. "language" is a code such as "en" or "vi".
- "topics": one topic per chapter or main heading of the document, in the document's order (usually 2 to 8).

Each topic has these fields, all present:
- "id": "t1", "t2", "t3", ... in order.
- "title": short heading taken from the document.
- "summary": one or two sentences, at most 40 words.
- "notes": 2 to 5 sections. Each section is {"heading": string, "points": [2 to 6 strings]}. Each point is one complete sentence of at most 30 words. Put the most important term of a point inside **double asterisks**, at most two per point. This is the only formatting allowed.
- "key_terms": 3 to 8 items {"term": string, "definition": string}. One-sentence definitions.
- "flashcards": 5 to 12 items {"front": string, "back": string}. The front is a question or a term. The back is a short answer of at most 25 words. One idea per card.

if (typeof module !== 'undefined' && module.exports) { module.exports = { I18N: I18N }; }

/* Core: parsing, validation, merging and hashing of study packs. Pure functions.
   Problems are returned as {key, vars} objects so the app can show them in the chosen language. */
function spMsg(key, vars) { return { key: key, vars: vars || {} }; }

function spStr(v) {
  if (typeof v === 'string') return v.trim();
  if (typeof v === 'number' && isFinite(v)) return String(v);
  return '';
}

function spParse(text) {
  var t = String(text == null ? '' : text).replace(/^﻿/, '').trim();
  if (!t) return { error: spMsg('empty') };
  var fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  var a = t.indexOf('{');
  var b = t.lastIndexOf('}');
  if (a >= 0 && b > a && (a > 0 || b < t.length - 1)) t = t.slice(a, b + 1);
  try {
    return { data: JSON.parse(t) };
  } catch (e) {
    return { error: spMsg('badjson', { d: e.message }) };
  }
}

function spNormalise(data) {
  var errors = [];
  var warnings = [];
  if (!data || typeof data !== 'object' || !Array.isArray(data.topics) || !data.topics.length) {
    errors.push(spMsg('notopics'));
    return { errors: errors, warnings: warnings };
  }
  var pack = {
    id: spStr(data.id),
    title: spStr(data.title) || 'Untitled study pack',
    subject: spStr(data.subject),
    level: spStr(data.level),
    language: spStr(data.language),
    topics: []
  };
  var used = {};
  data.topics.forEach(function (t, ti) {
    var n = ti + 1;
    if (!t || typeof t !== 'object') { warnings.push(spMsg('topic_obj', { n: n })); return; }
    var title = spStr(t.title);
    if (!title) { warnings.push(spMsg('topic_title', { n: n })); return; }
    var id = (spStr(t.id) || ('t' + n)).replace(/\s+/g, '-');
    var base = id, k = 2;
    while (used[id]) { id = base + '-' + k++; }
    used[id] = true;
    var topic = { id: id, title: title, summary: spStr(t.summary), notes: [], terms: [], cards: [], questions: [] };
    var at = function (key, s, extra) {
      var v = { n: n, t: title, s: s };
      for (var x in (extra || {})) v[x] = extra[x];
      warnings.push(spMsg(key, v));
    };

    (Array.isArray(t.notes) ? t.notes : []).forEach(function (s, si) {
      var pts = (s && Array.isArray(s.points) ? s.points : []).map(spStr).filter(Boolean);
      if (!pts.length) { at('note_empty', si + 1); return; }
      topic.notes.push({ heading: spStr(s.heading), points: pts });
    });

    (Array.isArray(t.key_terms) ? t.key_terms : (Array.isArray(t.terms) ? t.terms : [])).forEach(function (kt, ki) {
      var term = spStr(kt && kt.term), def = spStr(kt && kt.definition);
      if (!term || !def) { at('term_bad', ki + 1); return; }
      topic.terms.push({ term: term, definition: def });
    });

    (Array.isArray(t.flashcards) ? t.flashcards : (Array.isArray(t.cards) ? t.cards : [])).forEach(function (c, ci) {
      var f = spStr(c && c.front), b = spStr(c && c.back);
      if (!f || !b) { at('card_bad', ci + 1); return; }
      topic.cards.push({ front: f, back: b });
    });

    (Array.isArray(t.questions) ? t.questions : []).forEach(function (q, qi) {
      var s = qi + 1;
      if (!q || typeof q !== 'object') { at('q_obj', s); return; }
      var type = spStr(q.type).toLowerCase();
      var prompt = spStr(q.prompt);
      var expl = spStr(q.explanation);
      if (!prompt && type !== 'tfs') { at('q_prompt', s); return; }
      if (type === 'mcq') {
        var opts = (Array.isArray(q.options) ? q.options : []).map(spStr).filter(Boolean);
        var ans = typeof q.answer === 'number' ? q.answer : parseInt(q.answer, 10);
        if (opts.length < 2) { at('q_opts', s); return; }
        if (!Number.isInteger(ans) || ans < 0 || ans >= opts.length) { at('q_idx', s, { max: opts.length - 1 }); return; }
        var mq = { type: 'mcq', prompt: prompt, options: opts, answer: ans, explanation: expl };
        var mctx = spStr(q.context);
        if (mctx) { mq.context = mctx; var msrc = spStr(q.source); if (msrc) mq.source = msrc; }
        topic.questions.push(mq);
      } else if (type === 'truefalse') {
        var a = q.answer;
        if (typeof a === 'string') a = a.trim().toLowerCase() === 'true' ? true : a.trim().toLowerCase() === 'false' ? false : null;
        if (typeof a !== 'boolean') { at('q_tf', s); return; }
        topic.questions.push({ type: 'truefalse', prompt: prompt, answer: a, explanation: expl });
      } else if (type === 'short') {
        var sa = spStr(q.answer);
        if (!sa) { at('q_short', s); return; }
        topic.questions.push({ type: 'short', prompt: prompt, answer: sa, explanation: expl });
      } else if (type === 'tfs') {
        var tquote = spStr(q.quote), tits = [];
        (Array.isArray(q.items) ? q.items : []).forEach(function (it) {
          var tx = spStr(it && (it.text != null ? it.text : it.t));
          var av = it && (it.answer != null ? it.answer : it.a);
          if (typeof av === 'string') av = av.trim().toLowerCase() === 'true' ? true : av.trim().toLowerCase() === 'false' ? false : null;
          if (tx && typeof av === 'boolean') tits.push({ text: tx, answer: av });
        });
        if ((!tquote && !prompt) || tits.length < 2) { at('q_tfs', s); return; }
        if (tits.length > 6) tits = tits.slice(0, 6);
        topic.questions.push({ type: 'tfs', prompt: prompt, quote: tquote, source: spStr(q.source), items: tits, explanation: expl });
      } else if (type === 'cloze') {
        var blanks = prompt.match(/_{3,}/g);
        var rawA = Array.isArray(q.answers) ? q.answers : (q.answer != null ? (Array.isArray(q.answer) ? q.answer : [q.answer]) : []);
        var accepted = rawA.map(spStr).filter(Boolean);
        if (!blanks || blanks.length !== 1) { at('q_cloze', s); return; }
        if (!accepted.length) { at('q_cloze_a', s); return; }
        topic.questions.push({ type: 'cloze', prompt: prompt, answers: accepted, explanation: expl });
      } else if (type === 'match') {
        var mpairs = [], seenL = {}, seenR = {};
        (Array.isArray(q.pairs) ? q.pairs : []).forEach(function (pr) {
          var pl = spStr(pr && pr.left), prr = spStr(pr && pr.right);
          if (pl && prr && !seenL[pl] && !seenR[prr]) { seenL[pl] = seenR[prr] = 1; mpairs.push({ left: pl, right: prr }); }
        });
        if (mpairs.length < 2) { at('q_match', s); return; }
        if (mpairs.length > 8) mpairs = mpairs.slice(0, 8);
        topic.questions.push({ type: 'match', prompt: prompt, pairs: mpairs, explanation: expl });
      } else {
        at('q_type', s, { type: type });
      }
    });

    pack.topics.push(topic);
  });

  var items = 0;
  pack.topics.forEach(function (t) { items += t.notes.length + t.cards.length + t.questions.length; });
  if (!pack.topics.length || !items) {
    errors.push(spMsg('noitems'));
    return { errors: errors, warnings: warnings };
  }
  return { pack: pack, errors: errors, warnings: warnings };
}

function spMerge(packs) {
  if (packs.length === 1) return packs[0];
  var titles = [];
  packs.forEach(function (p) { if (titles.indexOf(p.title) < 0) titles.push(p.title); });
  var title = titles.length <= 2 ? titles.join(' + ') : titles[0] + ' + ' + (titles.length - 1) + ' more';

var EXAM_TYPES = ['mcq', 'truefalse', 'tfs', 'cloze', 'match', 'short'];

function examAvailTypes(scope) {

  return EXAM_TYPES.filter(function (t) { return c[t]; }).map(function (t) { return { type: t, n: c[t] }; });

function examIsAnswered(item) {
  var a = item.userAnswer, t = item.q.type;
  if (t === 'tfs') return Array.isArray(a) && a.some(function (v) { return v === true || v === false; });
  if (t === 'match') return !!a && typeof a === 'object' && Object.keys(a).length > 0;
  return a !== null && a !== undefined && a !== '';
}
function gradeExamItem(item) {
  var q = item.q, a = item.userAnswer, g = { score: 0, state: 'wrong' }, k, n;
  if (q.type === 'short') {
    if (item.selfOk === true) { g.score = 1; g.state = 'correct'; }
    else if (item.selfOk === false) { g.state = 'wrong'; }
    else g.state = examIsAnswered(item) ? 'pending' : 'skipped';
    return g;
  }
  if (!examIsAnswered(item)) { g.state = 'skipped'; return g; }
  if (q.type === 'mcq' || q.type === 'truefalse') g.score = a === q.answer ? 1 : 0;
  else if (q.type === 'tfs') {
    k = 0; n = q.items.length;
    q.items.forEach(function (x, i) { if (a[i] === x.answer) k++; });
    g.k = k; g.n = n; g.score = n === 4 ? TFS_SC[k] : k / n;
  } else if (q.type === 'cloze') {
    var n1 = norm1(a), n2 = norm2(a);
    g.score = q.answers.some(function (x) { return norm1(x) === n1 || norm2(x) === n2; }) ? 1 : 0;
  } else if (q.type === 'match') {
    k = 0; n = q.pairs.length;
    q.pairs.forEach(function (_, i) { if (a[i] === i) k++; });
    g.k = k; g.n = n; g.score = k / n;
  }
  g.state = g.score >= 1 ? 'correct' : (g.score > 0 ? 'partial' : 'wrong');

}

function jumpExamQ(idx) {

function startExam() {
  const cfg = examCfg();
  const ti = document.getElementById('examTimeInput');
  if (ti) cfg.time = Math.min(180, Math.max(5, parseInt(ti.value, 10) || cfg.time || 45));
  const types = examSelectedTypes(cfg);
  if (!types.length) return;

  let pool = [];
  scopeTopics(cfg.scope).forEach(t => {
    t.questions.forEach(q => { if (types.indexOf(q.type) >= 0) pool.push({ tid: t.id, ttitle: t.title, q: q }); });
  });
  if (!pool.length) return;
  shuffle(pool);
  const target = Math.min(cfg.mode === 'full' ? 40 : 20, pool.length);

  // every selected type that exists gets at least one question, the rest is random
  const by = {};
  pool.forEach(it => { (by[it.q.type] = by[it.q.type] || []).push(it); });
  let picked = [], rest = [];
  types.forEach(t => { if (by[t]) { picked.push(by[t][0]); rest = rest.concat(by[t].slice(1)); } });
  shuffle(rest);
  picked = picked.concat(rest.slice(0, Math.max(0, target - picked.length)));

  // shuffle inside each type, then pin the type order: mcq, true/false, ... , short
  shuffle(picked);
  picked.forEach((it, i) => { it._o = i; });
  picked.sort((a, b) => (EXAM_TYPES.indexOf(a.q.type) - EXAM_TYPES.indexOf(b.q.type)) || (a._o - b._o));

  const items = picked.map(it => {
    const o = { tid: it.tid, ttitle: it.ttitle, q: it.q, userAnswer: null, flagged: false };
    if (it.q.type === 'tfs') o.userAnswer = it.q.items.map(() => null);
    else if (it.q.type === 'match') {
      o.userAnswer = {}; o.selL = -1;
      o.rorder = shuffle(it.q.pairs.map((_, i) => i));
      if (o.rorder.length > 1 && o.rorder.every((v, i) => v === i)) o.rorder.push(o.rorder.shift());
    }
    return o;
  });

  S.exam = {
    step: 'doing',
    config: cfg,
    confirmingSubmit: false,
    run: {
      questions: items,
      currentIndex: 0,
      startTime: Date.now(),
      endTime: Date.now() + cfg.time * 60 * 1000
    }
  };
  saveExamRun();
  startExamTimer();
  render();
}

function examTfsPick(qIdx, i, v) {
  const it = S.exam.run && S.exam.run.questions[qIdx];
  if (!it) return;
  if (!Array.isArray(it.userAnswer)) it.userAnswer = it.q.items.map(() => null);
  it.userAnswer[i] = it.userAnswer[i] === v ? null : v;
  saveExamRun(); render();
}
function examMatchPick(qIdx, side, idx) {
  const it = S.exam.run && S.exam.run.questions[qIdx];
  if (!it) return;
  const mp = it.userAnswer && typeof it.userAnswer === 'object' ? it.userAnswer : (it.userAnswer = {});
  let k;
  if (it.selL == null) it.selL = -1;
  if (side === 'L') {
    if (mp[idx] != null) { delete mp[idx]; it.selL = idx; }
    else it.selL = it.selL === idx ? -1 : idx;
  } else {
    let owner = -1;
    for (k in mp) if (mp[k] === idx) owner = parseInt(k, 10);
    if (it.selL < 0) { if (owner >= 0) { delete mp[owner]; it.selL = owner; } }
    else { if (owner >= 0) delete mp[owner]; mp[it.selL] = idx; it.selL = -1; }
  }
  saveExamRun(); render();
}
function examSelfGrade(idx, ok) {

function startExamTimer() {
  if (window._examTimerInterval) clearInterval(window._examTimerInterval);
  window._examTimerInterval = setInterval(() => {
    if (!S.exam.run || S.exam.step !== 'doing') { clearInterval(window._examTimerInterval); return; }
    const remaining = S.exam.run.endTime - Date.now();
    const timerEl = document.getElementById('examTimer');
    if (remaining <= 0) {
      clearInterval(window._examTimerInterval);
      alert(tr('examTimeUp'));
      submitExam();
      return;
    }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    if (timerEl) timerEl.innerText = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }, 1000);
}

let submitConfirmCount = 0;

  if (!S.exam.confirmingSubmit) {
    S.exam.confirmingSubmit = true;
    render(); // Cập nhật lại giao diện nút bấm sang trạng thái chờ xác nhận
    
    // Tự động hủy trạng thái xác nhận sau 5 giây nếu người dùng không bấm nữa
    if (window._submitTimeout) clearTimeout(window._submitTimeout);
    window._submitTimeout = setTimeout(() => {
      if (S.exam && S.exam.confirmingSubmit) {
        S.exam.confirmingSubmit = false;
        render();

    }, 5000);
  } else {
    if (window._submitTimeout) clearTimeout(window._submitTimeout);
    S.exam.confirmingSubmit = false;
    submitExam();

function submitExam() {
  if (window._examTimerInterval) clearInterval(window._examTimerInterval);
  if (window._submitTimeout) clearTimeout(window._submitTimeout);
  const run = S.exam.run;
  if (!run) return;
  S.exam.confirmingSubmit = false;
  const used = Math.min(Date.now(), run.endTime) - run.startTime;
  S.exam.result = computeExamResult(run.questions, Math.max(0, used));
  S.exam.filter = 'all';
  S.exam.step = 'result';
  localStorage.removeItem('sp:run:' + S.key);
  render();
  window.scrollTo(0, 0);
}

  }

    e.preventDefault();
    if (currentIndex <= 0) {
      currentIndex = items.length - 1; // Nhảy xuống cuối danh sách nếu đang ở đầu
    } else {
      currentIndex--;

    items.forEach(i => i.classList.remove('kb-focus'));
    items[currentIndex].classList.add('kb-focus');
    items[currentIndex].scrollIntoView({ block: 'nearest' });
  } 
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (currentIndex >= 0 && items[currentIndex]) {
      items[currentIndex].click(); // Kích hoạt sự kiện chọn item đang focus
    } else {

/* ---------- Recent Packs Management ---------- */
  function getRecentPacks() {
    try { return JSON.parse(store.get('sp:recent_packs') || '[]'); } catch (e) { return []; }
  }
  function saveRecentPackToStorage(title, text) {
    if (!title || !text) return;
    var recents = getRecentPacks();
    var id = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
    // Loại bỏ tệp cũ nếu trùng tiêu đề để tránh lặp
    recents = recents.filter(function (p) { return p.title !== title; });
    recents.unshift({ id: id, title: title, text: text, updatedAt: Date.now() });
    // Giới hạn tối đa 5 tệp gần nhất
    if (recents.length > 5) recents = recents.slice(0, 5);
    store.set('sp:recent_packs', JSON.stringify(recents));
  }
  function renameRecentPack(id) {
    var recents = getRecentPacks();
    var pack = recents.filter(function (p) { return p.id === id; })[0];
    if (!pack) return;
    var newTitle = prompt('Nhập tên mới cho bộ ôn tập:', pack.title);
    if (newTitle && newTitle.trim()) {
      pack.title = newTitle.trim();
      store.set('sp:recent_packs', JSON.stringify(recents));
      render();
    }
  }
  function deleteRecentPack(id) {
    var recents = getRecentPacks();
    recents = recents.filter(function (p) { return p.id !== id; });
    store.set('sp:recent_packs', JSON.stringify(recents));
    render();
  }
  function loadRecentPack(id) {
    var recents = getRecentPacks();
    var pack = recents.filter(function (p) { return p.id === id; })[0];
    if (pack) {
      loadTexts([{ name: pack.title + '.json', text: pack.text }]);
    }
  }
  function editRecentPack(id) {
    var recents = getRecentPacks();
    var pack = recents.filter(function (p) { return p.id === id; })[0];
    if (pack) {
      var ta = $('#pasteIn');
      if (ta) {
        ta.value = pack.text;
        ta.scrollIntoView({ behavior: 'smooth' });
        flash(ta, 'Đã nạp nội dung vào ô dán!');
      }
    }
  }
  /* ---------- events ---------- */
  function flash(btn, text) {
    if (!btn) return;
    var old = btn.textContent; btn.textContent = text;
    setTimeout(function () { if (btn.isConnected) btn.textContent = old; }, 1600);
  }
  function copyPrompt(btn) {
    var text = $('#promptText').textContent.trim();
    var fallback = function () {
      var pre = $('#promptPre'); if (!pre) return;
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      flash(btn, tr('selected'));
    };
    try { navigator.clipboard.writeText(text).then(function () { flash(btn, tr('copied')); }, fallback); } catch (e) { fallback(); }
  }
/* ---------- Debug Inspector Logic ---------- */
  function updateDebugInfo() {
    var kEl = $('#dbgKey'), sEl = $('#dbgStats'), lmEl = $('#dbgLangMode'), stEl = $('#dbgStorage');
    if (!kEl) return;

/* ---------- light / dark theme ---------- */
var root = document.documentElement;

  }

  function isDark() {

    var newDark = isDark();

    root.classList.add('theme-anim');
    if (mode === 'system') {
      root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', mode);
    }
    syncTheme();

      var size = r < 0.12 ? 3 : (r < 0.45 ? 2 : 1.5);
      s.style.cssText = 'left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 100).toFixed(1) + '%;width:' + size + 'px;height:' + size + 'px;--d:' + (2.5 + Math.random() * 4).toFixed(1) + 's;--dl:-' + (Math.random() * 6).toFixed(1) + 's';

    } else {
