/* rainbow RGB buttons (opt-in, html.rb-on). --rb-h is animated on root; all elements inherit a single unified clock. */

}

}

.th-pv-read { font: 15px/1.5 var(--font-read); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); }
.th-pv mark { background: linear-gradient(to top, var(--mark) 0 48%, transparent 48%); color: inherit; }
.th-pv-muted { color: var(--muted); font-size: 13px; }
.th-pv-nav { background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.th-pv-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.th-pv-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 8px 14px; font-weight: 600; }
.th-pv-btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.th-pv-chip { background: var(--soft); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-weight: 600; }
.th-pv-fb { border: 1px solid; border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.th-pv-fb.ok { color: var(--good); background: var(--good-bg); border-color: var(--good); }
.th-pv-fb.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); }
.th-pv-fb.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
@media (width <= 860px) { .th-grid { grid-template-columns: minmax(0, 1fr); } .th-sticky { position: static; } .th-f { grid-template-columns: minmax(0, 1fr); } }

/* credits page */
.cr-hero { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.cr-hero b { font-size: clamp(20px, 3vw, 26px); }
.cr-tag { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 999px; background: var(--mark); color: var(--ink); }
.cr-sec .sec-h { margin: 0 0 10px; font-size: 18px; }
.cr-sec p { margin: 0 0 10px; max-width: 62ch; }
.cr-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.cr-list li { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; padding: 10px 14px; }
.cr-list li + li { border-top: 1px solid var(--line); }
.cr-list a { color: var(--ink); font-weight: 600; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.cr-list a:hover { color: var(--accent); }
.cr-note { margin-top: 8px; font-size: 13px; }

/* Layout: sticky top bar (language, theme, focus timer); below it a topic rail on the left and one working column. A fixed sky sits behind the page: a sun with drifting clouds by day, a crescent moon with twinkling stars by night. Marker-yellow underlines flag key terms, like a highlighter on a printed handout. */
:root {
  --bg: #F2F5E9; --surface: #FFFFFF; --ink: #14251A; --muted: #566559; --line: #D8DFCB; --soft: #E5EDD6;
  --accent: darkgreen; --accent-ink: #FFFFFF; --mark: #FFE15A;
  --good: #17784F; --good-bg: #DCF1E3; --warn: #9A5B00; --warn-bg: #FBEBCB; --bad: #B8362B; --bad-bg: #F9DEDA;
  --sun-ink: #C77D00; --moon-ink: #C9D3FF;
  --sun-glow: rgb(255 206 84 / 0.4); --moon-glow: rgb(132 153 255 / 0.2);
  --beam: rgb(255 208 80 / 0.14); --cloud: #FFFFFF; --cloud-shadow: rgb(40 90 50 / 0.1);
  --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-read: 'Lora', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Standardized Spacing Tokens */
  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-2xl: 48px;

  /* Standardized Radius Tokens */
  --rad-sm: 6px;
  --rad-md: 10px;
  --rad-lg: 16px;
  --rad-full: 9999px;

  /* Fluid Typography Scale (clamp) */
  --text-xs: clamp(0.7rem, 0.65rem + 0.25vw, 0.75rem);
  --text-sm: clamp(0.8rem, 0.75rem + 0.25vw, 0.875rem);
  --text-base: clamp(0.925rem, 0.875rem + 0.25vw, 1rem);
  --text-lg: clamp(1.1rem, 1.05rem + 0.35vw, 1.25rem);
  --text-xl: clamp(1.35rem, 1.25rem + 0.5vw, 1.6rem);
  --text-2xl: clamp(1.75rem, 1.5rem + 1vw, 2.25rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1222; --surface: #141C32; --ink: #E6EAF7; --muted: #93A0C3; --line: #26304D; --soft: #1B2542;
    --accent: #8499FF; --accent-ink: #0C1222; --mark: #6F5F0E;
    --good: #4CCB9F; --good-bg: #12362D; --warn: #E8AE4B; --warn-bg: #3A2D12; --bad: #F2857A; --bad-bg: #3D1F24;
    --sun-ink: #C77D00; --moon-ink: #C9D3FF;
    --sun-glow: rgb(255 206 84 / 0.4); --moon-glow: rgb(132 153 255 / 0.2);
    --beam: rgb(255 208 80 / 0.14); --cloud: #FFFFFF; --cloud-shadow: rgb(40 90 50 / 0.1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1222; --surface: #141C32; --ink: #E6EAF7; --muted: #93A0C3; --line: #26304D; --soft: #1B2542;
  --accent: #8499FF; --accent-ink: #0C1222; --mark: #6F5F0E;
  --good: #4CCB9F; --good-bg: #12362D; --warn: #E8AE4B; --warn-bg: #3A2D12; --bad: #F2857A; --bad-bg: #3D1F24;
  --sun-ink: #C77D00; --moon-ink: #C9D3FF;
  --sun-glow: rgb(255 206 84 / 0.4); --moon-glow: rgb(132 153 255 / 0.2);
  --beam: rgb(255 208 80 / 0.14); --cloud: #FFFFFF; --cloud-shadow: rgb(40 90 50 / 0.1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.15; text-wrap: balance; letter-spacing: -0.02em; }
::selection {
  background-color: var(--accent);
  color: var(--accent-ink);
}
p { margin: 0; }
.muted { color: var(--muted); }
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: linear-gradient(to top, var(--mark) 0 48%, transparent 48%); color: inherit; padding: 0 0.1em; }
.scroll { overflow-x: auto; }
/* =========================================================
   WEBKIT / IOS 16 COMPATIBILITY FIXES
   ========================================================= */

/* 1. Sửa lỗi đè chữ (Overlap) do Flex/Grid auto-rows trên WebKit cũ */
.prog {
  display: flex !important;
  flex-direction: column !important;
  align-items: stretch !important;
  gap: 16px !important;
}

@media (width > 860px) {
  .prog {
    flex-direction: row !important;
    align-items: center !important;
    gap: 28px !important;
  }
}

/* 2. Cố định bounding-box cho thẻ số lớn .big để tránh đè văn bản bên dưới */
.big {
  line-height: 1.1 !important;
  display: block !important;
  margin-bottom: 6px !important;
  /* Ép WebKit tính toán lại chiều cao chữ chính xác */
  height: auto !important;
  min-height: 1em !important;
}

.big span {
  display: inline-block !important;
  vertical-align: baseline !important;
}

/* 3. Sửa lỗi dính chữ/vỡ dòng trên Safari di động */
.lede, .m-l, .m-v, .prog p {
  -webkit-text-size-adjust: 100%;
  word-break: break-word;
  overflow-wrap: anywhere;
}

/* 4. Fix lỗi hiển thị hẹp khối chứa chữ số trên WebKit Mobile */
.prog > div:first-child {
  flex: none !important;
  min-width: fit-content;
}

.prog > div:last-child {
  flex: 1 1 auto !important;
  min-width: 0;
}
/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
@supports (background: color-mix(in srgb, red 50%, transparent)) {
  .top { background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
}
#app { position: relative; z-index: 1; }
.logo-bg { fill: var(--ink); }
.logo-lines { stroke: var(--bg); }
.logo-mark { fill: var(--mark); }
.tools { display: flex; align-items: center; gap: 10px; flex: none; }
.seg.seg-3 { 
  grid-template-columns: repeat(3, 1fr); 
  width: 116px;
}
.seg.seg-3::before { 
  width: calc(33.333% - 2px); 
  transform: translateX(0); 
}
.seg.seg-3[data-theme-mode="dark"]::before { transform: translateX(100%); }
.seg.seg-3[data-theme-mode="system"]::before { transform: translateX(200%); }
.seg.seg-3 button { 
  padding: 0; 
  display: grid; 
  place-items: center; 
  color: var(--muted); 
}
.seg.seg-3 button svg { width: 15px; height: 15px; }
.seg.seg-3 button[aria-pressed="true"] { color: var(--ink); }
.seg { 
  position: relative; 
  display: inline-grid; 
  grid-template-columns: 1fr 1fr; 
  height: 36px; 
  padding: 2px; 
  border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); 
  border-radius: 999px; 
  background: color-mix(in srgb, var(--soft) 50%, var(--surface)); 
  box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.04);
}
.seg::before { 
  content: ""; 
  position: absolute; 
  top: 2px; 
  bottom: 2px; 
  left: 2px; 
  width: calc(50% - 2px); 
  border-radius: 999px; 
  background: var(--surface); 
  box-shadow: 0 2px 6px rgb(0 0 0 / 0.08), 0 1px 2px rgb(0 0 0 / 0.04);
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1) !important; 
}
.seg[data-lang="en"]::before { transform: translateX(100%); }
.seg button { 
  position: relative; 
  z-index: 1; 
  border: 0; 
  background: none; 
  padding: 0 12px; 
  border-radius: 999px; 
  font: 600 12px var(--font-mono); 
  letter-spacing: 0.06em; 
  color: var(--muted); 
  transition: color 0.2s ease; 
}
.seg button[aria-pressed="true"] { color: var(--ink); }
.tbtn { 
  position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; overflow: hidden; padding: 0; 
  transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s cubic-bezier(0.25, 1, 0.5, 1) !important;
}
.tbtn:hover { border-color: var(--accent); }
.tbtn:active { transform: scale(0.93); }
.tbtn svg { grid-area: 1 / 1; width: 22px; height: 22px; transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.45s ease !important; }
.ti-sun { color: var(--sun-ink); }
.ti-moon { color: var(--moon-ink); transform: rotate(-110deg) scale(0.2); opacity: 0; }
.tbtn[data-dark="true"] .ti-sun { transform: rotate(110deg) scale(0.2); opacity: 0; }
.tbtn[data-dark="true"] .ti-moon { transform: none; opacity: 1; }
.tbtn[data-dark="true"] { background: var(--soft); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; padding: 6px 0; text-align: left; }
.brand b { font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand .pn { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 36ch; padding-left: 10px; border-left: 1px solid var(--line); }
.timer-wrap { position: relative; flex: none; }
.chip { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chip svg { width: 26px; height: 26px; transform: rotate(-90deg); }
.chip .trk { 
  stroke: var(--line); 
  fill: none; 
  transition: stroke 0.4s ease; /* Smooth snap to new theme stroke without muddy intermediate phases */
}
.chip .prg { 
  stroke: var(--accent); 
  fill: none; 
  stroke-linecap: round; 
  transition: stroke-dashoffset 0.3s linear, stroke 0.4s ease; 
}
.chip.on { border-color: var(--accent); }
.chip[data-mode="break"] .prg { stroke: var(--warn); }
.chip.alert { animation: pulse 1.2s ease-in-out infinite; }
#chipText { font: 500 15px var(--font-mono); font-variant-numeric: tabular-nums; }
.chip small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px var(--soft); } }

#timerPanel { 
  position: absolute; 
  right: 0; 
  top: calc(100% + 10px); 
  width: min(340px, calc(100vw - 32px)); 
  background: var(--surface); 
  border: 1px solid var(--line); 
  border-radius: 14px; 
  padding: 18px; 
  box-shadow: 0 14px 34px rgb(10 20 50 / 0.18); 
  display: grid; 
  gap: 14px; 

  /* Apple Popover Entry/Exit Animation States */
  opacity: 0;
  transform: translateY(-6px) scale(0.97);
  transform-origin: top right; /* Expands outward from the timer button */
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
              transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
              visibility 0.2s ease;
}

#timerPanel.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  visibility: visible;
  pointer-events: auto;
}
.t-head { display: flex; justify-content: space-between; align-items: baseline; }
.eyebrow { font: 500 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
#tBig { font: 500 60px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; text-align: center; padding-block: 4px; }
.t-btns { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { 
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 13px; 
  transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
}
.pill:hover { border-color: var(--accent); }
.pill:active { transform: scale(0.96); }
.t-custom { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.t-custom label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.t-custom input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: 500 15px var(--font-mono); }
#tStats { font-size: 13px; color: var(--muted); }
#tMsg { font-size: 14px; background: var(--good-bg); color: var(--ink); border-radius: 8px; padding: 9px 11px; }

/* buttons */
.btn { 
  display: inline-flex; 
  align-items: center; 
  justify-content: center; 
  gap: 8px; 
  border: 1px solid var(--line); 
  background: var(--surface); 
  border-radius: 9px; 
  padding: 9px 16px; 
  font-weight: 600; 
  /* Smooth deceleration curve: fast start, soft stop with zero overshoot */
  transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease;
}
.btn:hover { 
  border-color: var(--accent); 
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.04); /* Soft, natural elevation shadow */
}
.btn:active { 
  transform: scale(0.97); /* Weighted physical depression feel */
  box-shadow: none;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { 
  filter: brightness(1.05); 
  box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 25%, transparent); 
}
.btn.primary:active { 
  transform: scale(0.97); 
  filter: brightness(0.95); 
  box-shadow: none; 
}
.btn.again { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: 0.5; cursor: default; transform: none !important; box-shadow: none !important; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

/* shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; padding-block: 28px 72px; align-items: start; }
.rail { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow: auto; }
.rail-h { margin: 18px 10px 6px; font: 500 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.rail-list { display: flex; flex-direction: column; gap: 2px; }
.ui-dlg { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 20px; width: min(92vw, 420px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.ui-dlg::backdrop { background: rgba(5,8,18,.6); }
.ui-dlg h2 { margin: 0 0 8px; font-size: 18px; }
.ui-dlg p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }
.ui-dlg-in { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; margin-bottom: 14px; }
.ui-dlg-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.ui-dlg-btns .btn { min-height: 44px; }
.nav-i { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--ink); }
.nav-i:hover { background: var(--soft); }
.nav-i.cur { background: var(--ink); color: var(--bg); font-weight: 600; }
.dot { flex: none; width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5.5px); mask: radial-gradient(circle, transparent 4.5px, #000 5.5px); }
.nav-i.cur .dot { background: conic-gradient(var(--bg) calc(var(--p) * 1%), color-mix(in srgb, var(--bg) 28%, transparent) 0); }
.main { min-width: 0; }

.page-h { font-size: clamp(27px, 4.4vw, 42px); margin: 10px 0 8px; }
.lede { color: var(--muted); max-width: 62ch; }
.tag { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; background: var(--mark); color: var(--ink); padding: 3px 6px; border-radius: 4px; margin-left: 6px; }
.note { margin-top: 16px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface); max-width: 70ch; }
.note details summary { cursor: pointer; font-weight: 600; }
.note ul { margin: 8px 0 0; padding-left: 1.2em; color: var(--muted); }
.main > .note { max-width: none; } /* overview notes match .streak-card / .prog width */
.note.err { border-style: solid; border-color: var(--bad); background: var(--bad-bg); }

/* overview */
.prog { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; margin-top: 24px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.big { font: 700 68px/1 var(--font-ui); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.big span { font-size: 30px; color: var(--muted); letter-spacing: 0; }
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 14px 0 16px; }
.stats div { display: grid; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sec-h { margin: 34px 0 12px; font-size: 20px; }
.tlist { display: grid; gap: 8px; }
.trow { 
  display: grid; 
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); 
  gap: 16px; 
  width: 100%; 
  text-align: left; 
  background: var(--surface); 
  border: 1px solid var(--line); 
  border-radius: 12px; 
  padding: 14px 16px; 
  align-items: center; 
  /* Smooth, weight-based transition */
  transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease, border-color 0.2s ease;
}

.trow:hover { 
  border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.05); /* Soft ambient macOS shadow */
}
.trow h3 { font-size: 17px; margin-bottom: 3px; }
.trow p { color: var(--muted); font-size: 13.5px; display: -webkit-box; line-clamp: 2; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meters { display: grid; gap: 7px; }

.mtr.bad { border-color: var(--bad); background: var(--bad-bg); }
.mtr small { color: var(--muted); }
.res-i p { white-space: pre-line; }
.model { font: 16px/1.55 var(--font-read); padding: 10px 12px; background: var(--soft); border-radius: 8px; }
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

/* load + teacher */

/* AI Assistant Quick Launcher Styles */

  .rail { top: calc(70px + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - 84px); }
  .rail-h { margin: 14px 8px 6px; }

/* sky: sun and moon ride opposite ends of one rotating arm, so switching theme sets one and raises the other */
.sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; --R: min(78vh, 700px); --s: 132px; }
.wash { position: absolute; inset: 0; transition: opacity 1.1s ease !important; }
.wash.sun { background: radial-gradient(70vmax 55vmax at 92% 2%, var(--sun-glow), transparent 62%); }
.wash.moon { background: radial-gradient(70vmax 55vmax at 92% 2%, var(--moon-glow), transparent 62%); opacity: 0; }
.sky.dark .wash.sun { opacity: 0; }
.sky.dark .wash.moon { opacity: 1; }

.orbit { 
  position: absolute; 
  right: max(6vw, 84px); 
  top: calc(128px + var(--R)); 
  width: 0; 
  height: 0; 
  transform: rotate(var(--deg, 0deg)); /* Driven by dynamic JS variable */
}

.orb { 
  position: absolute; 
  width: var(--s); 
  height: var(--s); 
  left: calc(var(--s) / -2); 
  top: calc(var(--s) / -2); 
}

.orb svg { 
  width: 100%; 
  height: 100%; 
  overflow: visible; 
  animation: bob 8s ease-in-out infinite; 
}

/* Counter-rotate the sun and moon so they stay upright */
.orb.sun { 
  transform: translateY(calc(-1 * var(--R))) rotate(calc(-1 * var(--deg, 0deg))); 
}

.orb.moon { 
  transform: translateY(var(--R)) rotate(calc(-1 * var(--deg, 0deg))); 
}

/* Remove the old .sky.dark .orbit / .orb rules since rotation is now handled by --deg */

.sky.ready .orbit, .sky.ready .orb { 
  transition: transform 1.5s cubic-bezier(0.6, 0, 0.3, 1) !important; 
}
.rays { animation: spin 50s linear infinite; transform-origin: 0 0; }
.beams { position: absolute; left: 50%; top: 50%; width: 1200px; height: 1200px; margin: -600px 0 0 -600px; border-radius: 50%; background: repeating-conic-gradient(var(--beam) 0 5deg, transparent 5deg 20deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 66%); mask: radial-gradient(circle, #000 0, transparent 66%); animation: spin 180s linear infinite; }

.clouds { position: absolute; inset: 0; transition: opacity 1s ease !important; }
.sky.dark .clouds { opacity: 0; }
.cloud { position: absolute; opacity: 0.85; filter: drop-shadow(0 8px 12px var(--cloud-shadow)); animation: drift 90s ease-in-out infinite alternate; }
.cloud.c1 { width: 200px; top: 22%; left: 4%; }
.cloud.c2 { width: 150px; top: 52%; right: 6%; animation-duration: 120s; animation-delay: -30s; opacity: 0.7; }
.cloud.c3 { width: 270px; top: 76%; left: 28%; animation-duration: 140s; animation-delay: -60s; opacity: 0.6; }

.stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease 0.35s !important; }
.sky.dark .stars { opacity: 1; }
.stars i { position: absolute; border-radius: 50%; background: #DDE4FF; box-shadow: 0 0 5px rgba(221, 228, 255, 0.7); opacity: 0.35; animation: twinkle var(--d, 4s) ease-in-out infinite; animation-delay: var(--dl, 0s); }

@keyframes spin { to { transform: rotate(360deg); } }
.sky.paused *, .sky.paused .rays, .sky.paused .beams { animation-play-state: paused !important; }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes drift { to { transform: translateX(7vw); } }
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.3); }
}
.face, .trow {
  position: relative;
  overflow: hidden;
}

.face::after, .trow::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    350px circle at var(--mouse-x, -500px) var(--mouse-y, -500px),
    var(--accent),
    transparent 70%
  );
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
  mix-blend-mode: overlay; /* Blends smoothly with background and text */
}

.face:hover::after, .trow:hover::after {
  opacity: 0.35; /* Controls the intensity of the glow */
}

::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: 0.3s;
  animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
}

.main { 
  min-width: 0; 
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1), transform 0.2s cubic-bezier(0.25, 1, 0.5, 1); 
}
.main.is-switching {
  opacity: 0;
  transform: translateY(6px); /* Soft micro-slide down on exit, up on entry */
}
/* Optimize text and card elements for smooth language transition animations */
.page-h, .face, .tab, .nav-i span, .btn, .eyebrow, .brand b, .lede {
  will-change: opacity, transform;
}
/* colour change when the theme switches */
:root.theme-anim *, :root.theme-anim *::before, :root.theme-anim *::after {
  transition: background-color 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
}

/* Fast, crisp text, icon, and stroke transitions to prevent muddy mid-tone blending */
:root.theme-anim span, 
:root.theme-anim p, 
:root.theme-anim h1, 
:root.theme-anim h2, 
:root.theme-anim h3, 
:root.theme-anim button, 
:root.theme-anim svg *, 
:root.theme-anim .chip .trk, 
:root.theme-anim .chip .prg {
  transition: color 0.2s ease, fill 0.2s ease, stroke 0.2s ease !important;
}

/* Ensure the timer ring strokes transition smoothly */
.chip .trk, .chip .prg {
  transition: stroke-dashoffset 0.3s linear, stroke 0.6s ease;
}
.tab-content {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.22s cubic-bezier(0.25, 1, 0.5, 1), transform 0.22s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: opacity, transform;
}
.tab-content.is-switching {
  opacity: 0;
  transform: translateY(6px);
}
.streak-card {

.heatmap-container { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

/* Celebration Pop Animation */
@keyframes celebrate {
  0% { transform: scale(0.85); opacity: 0; }
  50% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.celebrate { 
  animation: celebrate 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; 
  transform-origin: center center;

/* Leitner Box Badges in Flashcards */

/* Brand Wrap & Debug Popup Styles */
.brand-wrap { position: relative; display: flex; align-items: center; min-width: 0; }
.debug-popup {
  position: absolute; 
  left: 0; 
  top: calc(100% + 10px); 
  width: 300px; 
  background: var(--surface); 
  border: 1px solid var(--line); 
  border-radius: 14px; 
  padding: 16px; 
  box-shadow: 0 14px 34px rgb(10 20 50 / 0.18); 
  
  /* Apple Popover Animation States */
  opacity: 0;
  transform: translateY(-6px) scale(0.97);
  transform-origin: top left;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
              transform 0.2s cubic-bezier(0.25, 1, 0.5, 1),

<script type="text/plain" id="promptText">
You convert a teacher's Word document into a "Study Pack": one JSON file that a revision website loads. Follow every rule exactly so the output has the same shape every time.

DELIVERY RULES (READ FIRST)
1. Create the result as a FILE and hand it to me as a download or attachment. Do NOT write the JSON in the chat. Name the file after the document and end the name with .studypack.json (for example chapter-1.studypack.json). The file contains the JSON object and nothing else.
2. Your chat reply must be very short, at most 3 lines: the file name, the number of topics, flashcards and questions, and your estimated coverage percentage (see COVERAGE). If the document already contains questions, also say how many it contains, how many you converted and how many you skipped because they need a picture, for example "questions in document: 112, converted: 104, skipped (need an image): 8". Do not paste, preview or summarise the file content in the chat.
3. If you can run code, build the file one topic at a time, then load it with a JSON parser (for example Python json.load) to confirm it is valid, and fix any error before delivering it. If you cannot create files at all, say so in one sentence, then output the complete JSON in a single code block with nothing else, so I can copy it into a .json file.
4. If the document is very long (roughly more than 20 pages or 8,000 words), do not shorten it. Split it into several files, each a complete and valid study pack for consecutive chapters, named like name-part1.studypack.json, name-part2.studypack.json. List the file names in the chat reply. A file may hold hundreds of questions: never cut questions to keep a file small, split into parts instead.

COVERAGE: THE FILE MUST CARRY AT LEAST 90% OF THE DOCUMENT'S INFORMATION
- Before writing, silently go through the whole document and list every information unit: each definition, fact, rule, formula, equation, date, name, number, unit, example, step in a process, cause and effect, comparison, classification, exception and conclusion. Every table row and every list item counts as its own unit. Text inside figures, captions and boxes counts if it carries information.
- At least 90% of these units must appear in the "notes" of the right topic, with exact numbers, names, dates, symbols and units kept as in the document. Never drop a detail just to stay short. If a topic becomes too large, split it into more topics or more note sections instead of leaving details out.
- Only repeated, decorative or administrative text (page numbers, headers, footers, greetings, instructions to the teacher) may be left out.
- Merge only true duplicates. Never squeeze two different facts into one vague sentence.
- "key_terms", "flashcards" and "questions" are built from the notes. Every key term, formula and definition in the notes must be in "key_terms" or in a flashcard, and every main fact must be tested by at least one flashcard or question.
- Before you reply, silently count the units again, estimate the percentage covered, and add anything that is missing. Report that percentage in the chat reply.
- Questions, exercises and exam items that are already written in the document are information units too, and ALL of them (100%, not 90%) must be converted, except the ones that need a picture (see QUESTIONS THAT NEED AN IMAGE below). See READY-MADE QUESTIONS below.
- Coverage never allows invention: everything in the file must still come from the document.

OUTPUT RULES (FOR THE FILE CONTENT)
1. The file is one JSON object. No introduction, no explanation, no Markdown code fence inside the file.
2. The JSON must be valid: double quotes around every key and string, no trailing commas, no comments. Escape a double quote inside a string as \" and avoid line breaks inside strings.
3. Use only information found in the document. Never add facts, dates, formulas or examples that are not in it. If the document has too little material for a target below, produce fewer items. Do not invent filler.
4. Write the content in the same language as the document. Keep every field name and every "type" value in English, exactly as shown.
5. Never leave a topic half finished. Every topic in the file must be complete.

FIELD GUIDE
Top level:
- "format": always "studypack".
- "version": always 1.
- "title", "subject", "level", "language": strings. Use "" when unknown. "language" is a code such as "en" or "vi".
- "topics": one topic per chapter or main heading of the document, in the document's order. Use as many topics as the document has. If one chapter is very long, split it into two or more topics with clear titles.

Each topic has these fields, all present:
- "id": "t1", "t2", "t3", ... in order.
- "title": short heading taken from the document.
- "summary": one or two sentences, at most 40 words.
- "notes": as many sections as the topic needs (usually 2 to 12). Each section is {"heading": string, "points": [2 to 10 strings]}. Each point is one complete sentence of at most 40 words that carries one fact (two closely linked facts at most). Put the most important term of a point inside **double asterisks**, at most two per point. This is the only formatting allowed. The notes are the main store of the document's information, so they must be detailed.
- "key_terms": 3 to 25 items {"term": string, "definition": string}. One-sentence definitions. Include every defined term, formula and named concept of the topic.
- "flashcards": 5 to 30 items {"front": string, "back": string}. The front is a question or a term. The back is a short answer of at most 30 words. One idea per card.
- "questions": there is NO maximum. Write at least 8 per topic when the material allows, roughly one question for every two note points. About half are "mcq", then "truefalse" and "short", plus "tfs", "cloze" and "match" wherever the material fits them (aim for at least one of each type in a topic that has enough material). Order from easy to hard. Question types are listed below.

READY-MADE QUESTIONS (APPLIES WHENEVER THE DOCUMENT ALREADY CONTAINS QUESTIONS)
- If the document contains questions, exercises, quizzes or exam items (multiple choice, true/false, short answer, fill in the blank, matching), count them first, then convert EVERY one into a question object. Do not sample, merge, shorten or cap them, even if there are more than 100. The only questions you may leave out are the ones described in QUESTIONS THAT NEED AN IMAGE. Writing extra questions of your own is allowed, but never instead of converting the ones in the document.
- Keep the original wording, the original options and their original order, and the original numbering order. Never shorten, summarise or cut the question text, the stem, the passage, the data or the statements, however long they are (there is NO word limit for questions, passages, or stems: long reading passages, multi-paragraph texts, chemical formulas, equations, multi-line stems and tables written as text stay complete and unabridged). Use the answer key in the document for "answer" and "explanation". If a question has no answer key, work the answer out only from the document's own content. If it truly cannot be decided from the document, leave that one out and report how many you left out in the chat reply.
- A multiple-choice question keeps its original number of options (2 to 6) and its original correct option. A question with a passage, stem or data and several statements a), b), c), d) to judge true or false becomes a "tfs". In "tfs", ALWAYS put the reading passage, stem, context, or data into "quote" in full, and put a short instruction into "prompt" (e.g. "Read the passage and decide whether each statement is true or false." or "Dựa vào thông tin sau, hãy xác định tính đúng/sai của từng mệnh đề." or ""). A numeric or one-line answer becomes "short" or "cloze". Pairs to connect become "match".
- Put each converted question in the topic it belongs to. If the document has a separate question bank or exercise section, create topics named after its parts (for example "Practice questions: Chapter 1") that hold those questions. Such a topic may have empty "notes", "key_terms" and "flashcards" arrays.
- The rule "answerable from the notes" does not apply to converted questions: they keep their original content.
  - mcq: {"type": "mcq", "prompt": string, "options": [exactly 4 strings for questions you write yourself; keep the original 2 to 6 options for converted questions], "answer": 0-based index of the correct option, "explanation": string}. One option is clearly correct. Distractors are plausible and come from the same topic. Never use "all of the above" or "none of the above". Vary the position of the correct option from question to question. Optional: "context" (a source passage or reading excerpt, preserved in full without any truncation or summarisation; there is NO word limit) and "source" (its citation), only when the question depends on a quotation or source text in the document.
  - truefalse: {"type": "truefalse", "prompt": a full statement, "answer": true or false as a JSON boolean, "explanation": string}. Roughly half of the statements are false.
  - short: {"type": "short", "prompt": string, "answer": model answer in one or two sentences, "explanation": string or ""}.
  - tfs (one source passage with true/false statements): {"type": "tfs", "prompt": string, "quote": string, "source": its citation or "", "items": [exactly 4 objects {"text": string, "answer": true or false as a JSON boolean}], "explanation": string}. Use whenever the document has a reading passage, data set, table, case study, or experiment stem followed by true/false statements.
    * ABSOLUTE RULE FOR "quote": MUST contain the entire passage, reading text, stem, experiment description, case study, context, or data table IN FULL, completely unabridged, verbatim from the source. NEVER truncate, never summarise, never cut with ellipsis (...), never omit sentences or paragraphs, and NEVER apply any arbitrary word limit. Long passages (even multi-paragraph texts of 500–1,500+ words), formulas, and data tables must stay 100% complete so all 4 statements can be accurately evaluated.
    * RULE FOR "prompt": Keep "prompt" strictly for a short instruction sentence (e.g. "Read the passage and decide whether each statement is true or false.", "Dựa vào đoạn tư liệu sau, hãy xác định các nhận định đúng hay sai." or ""). NEVER put the reading passage into "prompt" (the website styles "quote" in a dedicated reading blockquote, whereas "prompt" is rendered as a headline).
    * RULE FOR "items": Exactly 4 statements. Strip leading label prefixes like "a)", "b)", "c)", "d)" or "1.", "2." from the start of each statement's "text" (the website automatically formats and prefixes a), b), c), d) on screen). Keep the statement text itself complete without shortening. Make 1 to 3 of the 4 statements false.
  - cloze (fill in one blank): {"type": "cloze", "prompt": a sentence in which the missing word, number, date or name is replaced by ____ (four underscores), "answers": [1 to 4 accepted answers as strings, shortest form first], "explanation": string}. Exactly one ____ per question.
  - match (match pairs): {"type": "match", "prompt": a short instruction, "pairs": [4 to 5 objects {"left": string, "right": string}], "explanation": string}. Use for date and event, term and definition, or name and role. Every left and every right must be different.
  - Every question you write yourself must be answerable from that topic's notes and must never need a picture. Never write "according to the text", "see the figure" or refer to the document.
  - "explanation" is one or two sentences saying why the answer is right.

QUESTIONS THAT NEED AN IMAGE (SKIP THEM)
- The website shows text only. It cannot show pictures, so a question that cannot be understood or answered without looking at a picture must NOT be put in the file. Skip it completely: no question object, no placeholder, no "see the figure".
- Skip a question when its stem, its options or its statements depend on content that exists only in an image: a figure, photo, diagram, graph or chart, drawn structural or skeletal formula, apparatus or experiment drawing, circuit, map, scanned table, screenshot, or any option that is itself a picture (for example "Which diagram shows ...?", "In the figure, ...", "Based on the graph, ...", "Hình vẽ bên", "Quan sát hình", "Dựa vào đồ thị", "Sơ đồ sau").
- Keep the question when everything it needs is written as text, even if it mentions a figure in passing. A table, a data set, an equation or a formula typed as text is not an image: convert it and put it in "quote" or "context" in full without shortening. If the picture only decorates the question and the answer does not depend on it, keep the question and delete only the phrase that points at the picture.
- When a statement group (a, b, c, d) has some statements that need the image and some that do not, skip the whole question, because the file needs exactly 4 statements.
- Skipping is only about pictures. Never skip or truncate a question because it is long, hard, has long formulas or has a long reading passage.
- Count the skipped questions and report the number in the chat reply (see DELIVERY RULES). The information in the pictures does not count as information units for COVERAGE.

CONTENT FORMAT
- Plain text only, apart from **bold** around key terms in notes points. No HTML, no LaTeX, no Markdown headings, bullets or tables inside strings.
- Write formulas and units in plain text: CO2, H2O, m/s^2, x^2, 6CO2 + 6H2O -> C6H12O6 + 6O2.
- Turn every table in the document into note points (one point per row or per fact) and, where useful, flashcards. Do not skip table content.
- Ignore pictures, page numbers, headers and footers, but keep information that appears in captions or labels.
- Condense wording in notes points, not content. Shorten sentences in notes points, but keep every fact, number, name, date and unit. NEVER shorten, condense, or truncate questions, passages, stems, or quotes.

CHECK BEFORE YOU DELIVER (SILENTLY)
- The file is valid JSON that starts with { and ends with }, and it was delivered as a file, not pasted in the chat.
- Coverage: at least 90% of the document's information units are in the notes, and your percentage estimate is in the chat reply.
- Every mcq has exactly 4 options (or the original number, 2 to 6, for converted questions) and an integer "answer" that is a valid 0-based option index.
- Every question already written in the document is in the file: the number found equals converted plus skipped for needing an image (or any other shortfall is reported in the chat reply). No question in the file needs a picture to be understood or answered. No question text was shortened.
- In every "tfs" question, "quote" contains the full, complete passage or stem verbatim: no text was truncated, no paragraphs were dropped, and no ellipsis (...) was added.
- In every "tfs" question, "items" has exactly 4 statements with boolean answers, and statement texts do not have redundant "a) ", "b) " prefixes.
- Every truefalse "answer" is true or false without quotation marks.
- Every cloze prompt has exactly one ____ and an "answers" array. Every match has 4 to 5 pairs.
- Topic ids are unique and no field is missing. Use "" or [] when a field is empty.
- Nothing in the file is absent from the document.

/* Core: parsing, validation, merging and hashing of study packs. Pure functions.
   Problems are returned as {key, vars} objects so the app can show them in the chosen language. */
function spMsg(key, vars) { return { key: key, vars: vars || {} }; }

function spStr(v) {
  if (typeof v === 'string') return v.trim();
  if (typeof v === 'number' && isFinite(v)) return String(v);
  return '';
}

function spParse(text) {
  var t = String(text == null ? '' : text).replace(/^﻿/, '').trim();
  if (!t) return { error: spMsg('empty') };
  var fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  var a = t.indexOf('{');
  var b = t.lastIndexOf('}');
  if (a >= 0 && b > a && (a > 0 || b < t.length - 1)) t = t.slice(a, b + 1);
  try {
    return { data: JSON.parse(t) };
  } catch (e) {
    return { error: spMsg('badjson', { d: e.message }) };
  }
}

function spNormaliseFlat(data) {
  var errors = [];
  var warnings = [];
  if (!data || typeof data !== 'object' || !Array.isArray(data.topics) || !data.topics.length) {
    errors.push(spMsg('notopics'));
    return { errors: errors, warnings: warnings };
  }
  var pack = {
    id: spStr(data.id),
    title: spStr(data.title) || 'Untitled study pack',
    subject: spStr(data.subject),
    level: spStr(data.level),
    language: spStr(data.language),
    topics: []
  };
  var used = {};
  data.topics.forEach(function (t, ti) {
    var n = ti + 1;
    if (!t || typeof t !== 'object') { warnings.push(spMsg('topic_obj', { n: n })); return; }
    var title = spStr(t.title);
    if (!title) { warnings.push(spMsg('topic_title', { n: n })); return; }
    var id = (spStr(t.id) || ('t' + n)).replace(/\s+/g, '-');
    var base = id, k = 2;
    while (used[id]) { id = base + '-' + k++; }
    used[id] = true;
    var topic = { id: id, title: title, summary: spStr(t.summary), notes: [], terms: [], cards: [], questions: [] };
    var at = function (key, s, extra) {
      var v = { n: n, t: title, s: s };
      for (var x in (extra || {})) v[x] = extra[x];
      warnings.push(spMsg(key, v));
    };

    (Array.isArray(t.notes) ? t.notes : []).forEach(function (s, si) {
      var pts = (s && Array.isArray(s.points) ? s.points : []).map(spStr).filter(Boolean);
      if (!pts.length) { at('note_empty', si + 1); return; }
      topic.notes.push({ heading: spStr(s.heading), points: pts });
    });

    (Array.isArray(t.key_terms) ? t.key_terms : (Array.isArray(t.terms) ? t.terms : [])).forEach(function (kt, ki) {
      var term = spStr(kt && kt.term), def = spStr(kt && kt.definition);
      if (!term || !def) { at('term_bad', ki + 1); return; }
      topic.terms.push({ term: term, definition: def });
    });

    (Array.isArray(t.flashcards) ? t.flashcards : (Array.isArray(t.cards) ? t.cards : [])).forEach(function (c, ci) {
      var f = spStr(c && c.front), b = spStr(c && c.back);
      if (!f || !b) { at('card_bad', ci + 1); return; }
      topic.cards.push({ front: f, back: b });
    });

    (Array.isArray(t.questions) ? t.questions : []).forEach(function (q, qi) {
      var s = qi + 1;
      if (!q || typeof q !== 'object') { at('q_obj', s); return; }
      var type = spStr(q.type).toLowerCase();
      var prompt = spStr(q.prompt);
      var expl = spStr(q.explanation);
      if (!prompt && type !== 'tfs') { at('q_prompt', s); return; }
      if (type === 'mcq') {
        var opts = (Array.isArray(q.options) ? q.options : []).map(spStr).filter(Boolean);
        var ans = typeof q.answer === 'number' ? q.answer : parseInt(q.answer, 10);
        if (opts.length < 2) { at('q_opts', s); return; }
        if (!Number.isInteger(ans) || ans < 0 || ans >= opts.length) { at('q_idx', s, { max: opts.length - 1 }); return; }
        var mq = { type: 'mcq', prompt: prompt, options: opts, answer: ans, explanation: expl };
        var mctx = spStr(q.context);
        if (mctx) { mq.context = mctx; var msrc = spStr(q.source); if (msrc) mq.source = msrc; }
        topic.questions.push(mq);
      } else if (type === 'truefalse') {
        var a = q.answer;
        if (typeof a === 'string') a = a.trim().toLowerCase() === 'true' ? true : a.trim().toLowerCase() === 'false' ? false : null;
        if (typeof a !== 'boolean') { at('q_tf', s); return; }
        topic.questions.push({ type: 'truefalse', prompt: prompt, answer: a, explanation: expl });
      } else if (type === 'short') {
        var sa = spStr(q.answer);
        if (!sa) { at('q_short', s); return; }
        topic.questions.push({ type: 'short', prompt: prompt, answer: sa, explanation: expl });
      } else if (type === 'tfs') {
        var tquote = spStr(q.quote || q.context || q.passage || q.stem), tits = [];
        (Array.isArray(q.items) ? q.items : []).forEach(function (it) {
          var rawTx = it && (it.text != null ? it.text : it.t);
          var tx = spStr(rawTx != null ? String(rawTx).replace(/^[a-dA-D1-4][\)\.\:\-]\s*/, '') : '');
          var av = it && (it.answer != null ? it.answer : it.a);
          if (typeof av === 'string') av = av.trim().toLowerCase() === 'true' ? true : av.trim().toLowerCase() === 'false' ? false : null;
          if (tx && typeof av === 'boolean') tits.push({ text: tx, answer: av });
        });
        if ((!tquote && !prompt) || tits.length < 4) { at('q_tfs', s); return; }
        if (tits.length > 4) { tits = tits.slice(0, 4); at('q_tfs_extra', s); }
        topic.questions.push({ type: 'tfs', prompt: prompt, quote: tquote, source: spStr(q.source), items: tits, explanation: expl });
      } else if (type === 'cloze') {
        var blanks = prompt.match(/_{3,}/g);
        var rawA = Array.isArray(q.answers) ? q.answers : (q.answer != null ? (Array.isArray(q.answer) ? q.answer : [q.answer]) : []);
        var accepted = rawA.map(spStr).filter(Boolean);
        if (!blanks || blanks.length !== 1) { at('q_cloze', s); return; }
        if (!accepted.length) { at('q_cloze_a', s); return; }
        topic.questions.push({ type: 'cloze', prompt: prompt, answers: accepted, explanation: expl });
      } else if (type === 'match') {
        var mpairs = [], seenL = {}, seenR = {};
        (Array.isArray(q.pairs) ? q.pairs : []).forEach(function (pr) {
          var pl = spStr(pr && pr.left), prr = spStr(pr && pr.right);
          if (pl && prr && !seenL[pl] && !seenR[prr]) { seenL[pl] = seenR[prr] = 1; mpairs.push({ left: pl, right: prr }); }
        });
        if (mpairs.length < 2) { at('q_match', s); return; }
        if (mpairs.length > 8) mpairs = mpairs.slice(0, 8);
        topic.questions.push({ type: 'match', prompt: prompt, pairs: mpairs, explanation: expl });
      } else {
        at('q_type', s, { type: type });
      }
    });

    pack.topics.push(topic);
  });

  var items = 0;
  pack.topics.forEach(function (t) { items += t.notes.length + t.cards.length + t.questions.length; });
  if (!pack.topics.length || !items) {
    errors.push(spMsg('noitems'));
    return { errors: errors, warnings: warnings };
  }
  return { pack: pack, errors: errors, warnings: warnings };
}

/* A pack may nest subpacks: a node has topics[] and packs[] (child nodes). Counting the pack itself, at most SP_MAX_DEPTH levels.
   Result stays FLAT for the rest of the app: pack.topics holds every topic; a topic in a subpack has id "<path>/<id>" (so progress keys
   become "<path>/<id>:<index>") and topic.node = path. pack.nodes lists the subpacks: {path, id, title, summary, parent, depth}.
   A pack with no subpacks is exactly the old shape (ids and progress keys unchanged). */
var SP_MAX_DEPTH = 3;
function spNormalise(data) {
  var kidsOf = function (n) { return n && typeof n === 'object' && Array.isArray(n.packs) ? n.packs : []; };
  if (!kidsOf(data).length) {
    var flat = spNormaliseFlat(data);
    if (flat.pack) { flat.pack.nodes = []; flat.pack.topics.forEach(function (t) { t.node = ''; }); }
    return flat;
  }
  var errors = [], warnings = [], items = 0;
  var pack = { id: spStr(data.id), title: spStr(data.title) || 'Untitled study pack', subject: spStr(data.subject), level: spStr(data.level), language: spStr(data.language), topics: [], nodes: [] };
  function note(list, m, label) { if (label) m.node = label; list.push(m); }
  function walk(node, path, level, label) {
    var tl = Array.isArray(node.topics) ? node.topics : [];
    if (tl.length) {
      var r = spNormaliseFlat({ topics: tl });
      r.warnings.forEach(function (w) { note(warnings, w, label); });
      /* a node whose topics are all unusable is skipped with a note; only an entirely empty pack is an error */
      r.errors.forEach(function (e) { note(warnings, e, label); });
      if (r.pack) r.pack.topics.forEach(function (t) {
        t.id = path ? path + '/' + t.id : t.id; t.node = path; pack.topics.push(t);
        items += t.notes.length + t.cards.length + t.questions.length;
      });
    }
    var used = {};
    kidsOf(node).forEach(function (k, i) {
      var n = i + 1;
      if (!k || typeof k !== 'object') { note(warnings, spMsg('node_obj', { n: n }), label); return; }
      var title = spStr(k.title);
      if (!title) { note(warnings, spMsg('node_title', { n: n }), label); return; }
      if (level + 1 > SP_MAX_DEPTH) { errors.push(spMsg('depth', { node: title, n: SP_MAX_DEPTH })); return; }
      var id = (spStr(k.id) || ('s' + n)).replace(/[\s\/]+/g, '-'), base = id, c = 2;
      while (used[id]) { id = base + '-' + c++; }
      used[id] = true;
      var p2 = path ? path + '/' + id : id;
      pack.nodes.push({ path: p2, id: id, title: title, summary: spStr(k.summary), parent: path, depth: level + 1 });
      walk(k, p2, level + 1, label ? label + ' › ' + title : title);
    });
  }
  walk(data, '', 1, '');
  if (errors.length) return { errors: errors, warnings: warnings };
  if (!items) { errors.push(spMsg('noitems')); return { errors: errors, warnings: warnings }; }
  return { pack: pack, errors: errors, warnings: warnings };
}

/* Back to the nested JSON shape (storage, sharing, editor). topicFn(topic, localId) makes the output topic. */
function spTopicOut(t, local) { var c = {}; for (var k in t) if (k !== 'node') c[k] = t[k]; c.id = local; return c; }
function spSerialise(pack, topicFn, rootPath) {
  topicFn = topicFn || spTopicOut; rootPath = rootPath || '';
  var nodes = pack.nodes || [];
  function build(path) {
    var o = { topics: pack.topics.filter(function (t) { return (t.node || '') === path; }).map(function (t) { return topicFn(t, path ? t.id.slice(path.length + 1) : t.id); }) };
    var kids = nodes.filter(function (n) { return n.parent === path; });
    if (kids.length) o.packs = kids.map(function (n) { var c = { id: n.id, title: n.title }; if (n.summary) c.summary = n.summary; var b = build(n.path); c.topics = b.topics; if (b.packs) c.packs = b.packs; return c; });
    return o;
  }
  var b = build(rootPath), out = {};
  var info = rootPath ? nodes.filter(function (n) { return n.path === rootPath; })[0] : null;
  if (!rootPath && pack.id) out.id = pack.id;
  out.title = info ? info.title : pack.title;
  out.subject = pack.subject; out.level = pack.level; out.language = pack.language;
  out.topics = b.topics; if (b.packs) out.packs = b.packs;
  return out;
}

function spMerge(packs) {
  if (packs.length === 1) return packs[0];
  var titles = [];
  packs.forEach(function (p) { if (titles.indexOf(p.title) < 0) titles.push(p.title); });
  var title = titles.length <= 2 ? titles.join(' + ') : titles[0] + ' + ' + (titles.length - 1) + ' more';
  var pick = function (k) { for (var i = 0; i < packs.length; i++) if (packs[i][k]) return packs[i][k]; return ''; };
  var out = { id: packs.every(function (p) { return p.id; }) ? packs.map(function (p) { return p.id; }).join('+') : '', title: title, subject: pick('subject'), level: pick('level'), language: pick('language'), topics: [] };
  if (packs.some(function (p) { return p.nodes && p.nodes.length; })) {
    out.nodes = []; var usedN = {};
    packs.forEach(function (p, i) {
      var nid = (p.id || ('m' + (i + 1))).replace(/[\s\/]+/g, '-'), nb = nid, nc = 2;
      while (usedN[nid]) { nid = nb + '-' + nc++; }
      usedN[nid] = true;
      out.nodes.push({ path: nid, id: nid, title: p.title, summary: '', parent: '', depth: 2 });
      (p.nodes || []).forEach(function (n) { var c = {}; for (var k in n) c[k] = n[k]; c.path = nid + '/' + n.path; c.parent = n.parent ? nid + '/' + n.parent : nid; c.depth = n.depth + 1; out.nodes.push(c); });
      p.topics.forEach(function (t) { var c = {}; for (var k in t) c[k] = t[k]; c.id = nid + '/' + t.id; c.node = t.node ? nid + '/' + t.node : nid; out.topics.push(c); });
    });
    return out;
  }
  var used = {};
  packs.forEach(function (p) {
    p.topics.forEach(function (t) {
      var id = t.id, base = id, n = 2;
      while (used[id]) { id = base + '-' + n++; }
      used[id] = true;
      var copy = {};
      for (var k in t) copy[k] = t[k];
      copy.id = id;
      out.topics.push(copy);
    });
  });
  out.nodes = [];

  function getStreakData(daysCount) {

      if (count > 0) {

        deck.push({ id: cid, tt: t.title, front: c.front, back: c.back });
      });
    });
    var total = deck.length;
    var pool = deck.map(function (c) { return c.id; });
    if (S.copts.skipKnown) deck = deck.filter(function (c) { return !cardKnown(S.prog.cards[c.id]); });

    S.cards = { scope: scope, queue: deck, total: total, pool: pool, filter: flt, flipped: false, got: 0, again: 0, hist: [] };
  }

      return h;
    }

    h += '<div class="prog-line"><span>' + tr('left_n', { n: C.queue.length }) + '</span><span>' + tr('known_of', { k: known, n: C.total }) + '</span></div>';

    h += '<div class="star-row"><button class="btn star-btn' + (isStar(c.id) ? ' on' : '') + '" data-act="nd_star" aria-pressed="' + isStar(c.id) + '" title="S">' + tr(isStar(c.id) ? 'star_on' : 'star_add') + '</button></div>';
    h += '<div class="nav-row"><button class="btn" data-act="cardPrev"' + ((C.hist && C.hist.length) ? '' : ' disabled') + '>\u21A9 ' + tr('btn_prev') + '</button><button class="btn" data-act="cardSkip"' + (C.queue.length > 1 ? '' : ' disabled') + '>' + tr('btn_skip') + ' \u21AA</button></div></div>';
    return h;
  }

 /*------exam------*/
var EXAM_TYPES = ['mcq', 'truefalse', 'tfs', 'cloze', 'match', 'short'];
function examCfg() {
  if (!S.exam.config) S.exam.config = { scope: 'all', mode: 'full', time: 45, off: { truefalse: true }, touched: false };
  if (!S.exam.config.off) S.exam.config.off = {};
  return S.exam.config;
}
function examAvailTypes(scope) {
  var c = {};
  scopeTopics(scope).forEach(function (t) { t.questions.forEach(function (q) { c[q.type] = (c[q.type] || 0) + 1; }); });
  return EXAM_TYPES.filter(function (t) { return c[t]; }).map(function (t) { return { type: t, n: c[t] }; });
}
function examSelectedTypes(cfg) {
  return examAvailTypes(cfg.scope).filter(function (x) { return !cfg.off[x.type]; }).map(function (x) { return x.type; });
}
function examIsAnswered(item) {
  var a = item.userAnswer, t = item.q.type;
  if (t === 'tfs') return Array.isArray(a) && a.some(function (v) { return v === true || v === false; });
  if (t === 'match') return !!a && typeof a === 'object' && Object.keys(a).length > 0;
  return a !== null && a !== undefined && a !== '';
}
function gradeExamItem(item) {
  var q = item.q, a = item.userAnswer, g = { score: 0, state: 'wrong' }, k, n;
  if (q.type === 'short') {
    if (item.selfOk === true) { g.score = 1; g.state = 'correct'; }
    else if (item.selfOk === false) { g.state = 'wrong'; }
    else g.state = examIsAnswered(item) ? 'pending' : 'skipped';
    return g;
  }
  if (!examIsAnswered(item)) { g.state = 'skipped'; return g; }
  if (q.type === 'mcq' || q.type === 'truefalse') g.score = a === q.answer ? 1 : 0;
  else if (q.type === 'tfs') {
    k = 0; n = q.items.length;
    q.items.forEach(function (x, i) { if (a[i] === x.answer) k++; });
    g.k = k; g.n = n; g.score = tfsScore(k, n);
  } else if (q.type === 'cloze') {
    var n1 = norm1(a), n2 = norm2(a);
    g.score = q.answers.some(function (x) { return norm1(x) === n1 || norm2(x) === n2; }) ? 1 : 0;
  } else if (q.type === 'match') {
    k = 0; n = q.pairs.length;
    q.pairs.forEach(function (_, i) { if (a[i] === i) k++; });
    g.k = k; g.n = n; g.score = k / n;
  }
  g.state = g.score >= 1 ? 'correct' : (g.score > 0 ? 'partial' : 'wrong');
  return g;
}
function computeExamResult(questions, timeUsed) {
  var total = questions.length || 1, p1 = 0, p2 = 0;
  var cnt = { correct: 0, partial: 0, wrong: 0, skipped: 0, pending: 0 };
  var grades = questions.map(function (item) {
    var g = gradeExamItem(item);
    if (item.q.type === 'mcq') p1 += g.score; else p2 += g.score;
    cnt[g.state]++;
    return g;
  });
  return { questions: questions, grades: grades, counts: cnt, timeUsed: timeUsed, score: (p1 + p2) / total * 10, scorePart1: p1 / total * 10, scorePart2: p2 / total * 10 };
}

function examPromptHTML(item) {
  var q = item.q, h = '';
  if ((q.type === 'mcq' && (q.context || q.quote)) || (q.type === 'tfs' && (q.quote || q.context))) h += '<div style="margin-bottom:14px">' + ctxHTML(q) + '</div>';
  if (q.type === 'cloze') h += '<div style="font-size: 16px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; color: var(--ink);">' + clozePrompt(q) + '</div>';
  else if (q.prompt) h += '<div style="font-size: 16px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; color: var(--ink);">' + rich(q.prompt) + '</div>';
  return h;
}

function renderExamQuestionInput(item, idx) {
  var q = item.q, a = item.userAnswer, h = '', i;
  if (q.type === 'mcq') {
    for (i = 0; i < q.options.length; i++) {
      var on = a === i, letter = ['A', 'B', 'C', 'D', 'E', 'F'][i] || String(i + 1);
      h += '<button role="radio" aria-checked="' + (on ? 'true' : 'false') + '" class="opt exam-opt' + (on ? ' selected' : '') + '" data-act="examSelectAns" data-qidx="' + idx + '" data-val="' + i + '">' +
        '<span class="exam-opt-badge">' + letter + '</span>' +
        '<span class="exam-opt-text">' + rich(q.options[i]) + '</span></button>';
    }
    return '<div role="radiogroup" aria-label="' + esc(tr('aria_choices')) + '" class="exam-opts">' + h + '</div>';
  }
  if (q.type === 'truefalse') {
    [true, false].forEach(function (b, n) {
      var on = a === b;
      h += '<button role="radio" aria-checked="' + (on ? 'true' : 'false') + '" class="opt exam-opt' + (on ? ' selected' : '') + '" data-act="examSelectAns" data-qidx="' + idx + '" data-val="' + b + '">' +
        '<span class="exam-opt-badge">' + (n + 1) + '</span>' +

    });

  }
  if (q.type === 'tfs') {
    q.items.forEach(function (x, n) {
      h += '<div class="tfi"><p>' + String.fromCharCode(97 + n) + ') ' + rich(x.text) + '</p><div class="tfb">';
      [true, false].forEach(function (b) {
        h += '<button class="tfo' + (Array.isArray(a) && a[n] === b ? ' sel' : '') + '" data-act="examTfs" data-qidx="' + idx + '" data-i="' + n + '" data-v="' + (b ? 1 : 0) + '">' + esc(tfLabel(b)) + '</button>';
      });
      h += '</div></div>';
    });
    return '<p class="muted" style="margin-bottom:10px">' + tr('tfs_hint') + '</p><div class="tfs">' + h + '</div>';
  }
  if (q.type === 'match') {
    if (!item.rorder) item.rorder = shuffle(q.pairs.map(function (_, n) { return n; }));
    var mp = a || {}, k;
    h = '<p class="muted" style="margin-bottom:10px">' + tr('mt_hint') + '</p><div class="mt"><div class="mtc">';
    q.pairs.forEach(function (p, n) {
      h += '<button class="mtb' + (mp[n] != null ? ' paired' : '') + (item.selL === n ? ' sel' : '') + '" data-act="examMatch" data-qidx="' + idx + '" data-s="L" data-i="' + n + '"><span class="k">' + (n + 1) + '</span><span>' + rich(p.left) + '</span></button>';
    });
    h += '</div><div class="mtc">';
    item.rorder.forEach(function (j) {
      var owner = -1;
      for (k in mp) if (mp[k] === j) owner = parseInt(k, 10);
      h += '<button class="mtb' + (owner >= 0 ? ' paired' : '') + '" data-act="examMatch" data-qidx="' + idx + '" data-s="R" data-i="' + j + '"><span class="k">' + (owner >= 0 ? owner + 1 : '&middot;') + '</span><span>' + rich(q.pairs[j].right) + '</span></button>';
    });
    return h + '</div></div>';
  }
  if (q.type === 'short') {
    return '<label style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;">' + tr('ans_aria') + '</label>' +
      '<textarea class="typed" placeholder="' + esc(tr('ph_typed')) + '" data-exam-input="' + idx + '">' + esc(a || '') + '</textarea>';
  }
  /* cloze and anything else: single line */
  return '<label style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;">' + tr('ans_aria') + '</label>' +
    '<input type="text" class="typed clin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(tr('ans_hint')) + '" value="' + esc(a || '') + '" data-exam-input="' + idx + '" />';
}

function rvRow(text, cls, label) {
  return '<div class="rv-row' + (cls ? ' ' + cls : '') + '"><span>' + rich(text) + '</span>' + (label ? '<small>' + esc(label) + '</small>' : '') + '</div>';
}
function examReviewItem(item, i, g) {
  var q = item.q, a = item.userAnswer, rows = '', n;
  var icon = { correct: '\u2705', partial: '\uD83D\uDFE1', wrong: '\u274C', skipped: '\u26AA', pending: '\u23F3' }[g.state];
  var lab = { correct: tr('correct'), partial: tr('partial'), wrong: tr('notquite'), skipped: tr('examStatSkipped'), pending: tr('examStatPending') }[g.state];
  if (q.type === 'mcq') {
    q.options.forEach(function (o, oi) {
      var cls = oi === q.answer ? 'ok' : (a === oi ? 'bad' : '');
      rows += rvRow(['A', 'B', 'C', 'D', 'E', 'F'][oi] + '. ' + o, cls, oi === q.answer ? tr('lab_correct') : (a === oi ? tr('lab_yours') : ''));
    });
  } else if (q.type === 'truefalse') {
    [true, false].forEach(function (b) {
      rows += rvRow(tfLabel(b), b === q.answer ? 'ok' : (a === b ? 'bad' : ''), b === q.answer ? tr('lab_correct') : (a === b ? tr('lab_yours') : ''));
    });
  } else if (q.type === 'tfs') {
    q.items.forEach(function (x, ii) {
      var v = Array.isArray(a) ? a[ii] : null, good = v === x.answer;
      var label = tr('lab_yours') + ': ' + (v === true || v === false ? tfLabel(v) : tr('unanswered')) + (good ? '' : ' \u00b7 ' + tr('lab_correct') + ': ' + tfLabel(x.answer));
      rows += rvRow(String.fromCharCode(97 + ii) + ') ' + x.text, good ? 'ok' : 'bad', label);
    });
  } else if (q.type === 'cloze') {
    rows += rvRow(a || tr('unanswered'), g.state === 'correct' ? 'ok' : 'bad', tr('lab_yours'));
    if (g.state !== 'correct') rows += rvRow(q.answers.join(' / '), 'ok', tr('lab_correct'));
  } else if (q.type === 'match') {
    q.pairs.forEach(function (p, pi) {
      var m = a ? a[pi] : null, good = m === pi;
      rows += rvRow(p.left + ' \u2192 ' + (m != null ? q.pairs[m].right : tr('unanswered')), good ? 'ok' : 'bad', good ? '' : tr('mt_correct_is', { a: p.right }));
    });
  } else if (q.type === 'short') {
    rows += rvRow(a || tr('unanswered'), '', tr('lab_yours'));
    rows += rvRow(q.answer, 'ok', tr('model_answer'));
    rows += '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm' + (item.selfOk === true ? ' primary' : '') + '" data-act="examSelfGrade" data-idx="' + i + '" data-ok="1">' + tr('had_it') + '</button><button class="btn sm' + (item.selfOk === false ? ' again' : '') + '" data-act="examSelfGrade" data-idx="' + i + '" data-ok="0">' + tr('not_yet_btn') + '</button></div>';
  }
  var h = '<div class="res-i" style="gap:10px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>' + icon + ' ' + tr('question') + ' ' + (i + 1) + '</b><span class="muted" style="font-size:12px">' + esc(tr('qt_' + q.type)) + ' \u00b7 ' + esc(lab) + (g.n ? ' (' + g.k + '/' + g.n + ')' : '') + '</span></div>';
  h += examPromptHTML(item);
  h += '<div class="rv-stack">' + rows + '</div>';
  if (q.explanation) h += '<div style="font-size:14px;color:var(--muted);line-height:1.5">' + rich(q.explanation) + '</div>';
  return h + '</div>';
}
