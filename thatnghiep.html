<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Revision Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: sticky top bar (language, theme, focus timer); below it a topic rail on the left and one working column. A fixed sky sits behind the page: a sun with drifting clouds by day, a crescent moon with twinkling stars by night. Marker-yellow underlines flag key terms, like a highlighter on a printed handout. */
:root {
  --bg: #F2F5E9; --surface: #FFFFFF; --ink: #14251A; --muted: #566559; --line: #D8DFCB; --soft: #E5EDD6;
  --accent: darkgreen; --accent-ink: #FFFFFF; --mark: #FFE15A;
  --good: #17784F; --good-bg: #DCF1E3; --warn: #9A5B00; --warn-bg: #FBEBCB; --bad: #B8362B; --bad-bg: #F9DEDA;
  --sun-ink: #C77D00; --moon-ink: #C9D3FF;
  --sun-glow: rgb(255 206 84 / 0.4); --moon-glow: rgb(132 153 255 / 0.2);
  --beam: rgb(255 208 80 / 0.14); --cloud: #FFFFFF; --cloud-shadow: rgb(40 90 50 / 0.1);
  --font-ui: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-read: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1222; --surface: #141C32; --ink: #E6EAF7; --muted: #93A0C3; --line: #26304D; --soft: #1B2542;
    --accent: #8499FF; --accent-ink: #0C1222; --mark: #6F5F0E;
    --good: #4CCB9F; --good-bg: #12362D; --warn: #E8AE4B; --warn-bg: #3A2D12; --bad: #F2857A; --bad-bg: #3D1F24;
    --sun-ink: #C77D00; --moon-ink: #C9D3FF;
    --sun-glow: rgb(255 206 84 / 0.4); --moon-glow: rgb(132 153 255 / 0.2);
    --beam: rgb(255 208 80 / 0.14); --cloud: #FFFFFF; --cloud-shadow: rgb(40 90 50 / 0.1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1222; --surface: #141C32; --ink: #E6EAF7; --muted: #93A0C3; --line: #26304D; --soft: #1B2542;
  --accent: #8499FF; --accent-ink: #0C1222; --mark: #6F5F0E;
  --good: #4CCB9F; --good-bg: #12362D; --warn: #E8AE4B; --warn-bg: #3A2D12; --bad: #F2857A; --bad-bg: #3D1F24;
  --sun-ink: #C77D00; --moon-ink: #C9D3FF;
  --sun-glow: rgb(255 206 84 / 0.4); --moon-glow: rgb(132 153 255 / 0.2);
  --beam: rgb(255 208 80 / 0.14); --cloud: #FFFFFF; --cloud-shadow: rgb(40 90 50 / 0.1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.15; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: linear-gradient(to top, var(--mark) 0 48%, transparent 48%); color: inherit; padding: 0 0.1em; }
.scroll { overflow-x: auto; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
@supports (background: color-mix(in srgb, red 50%, transparent)) {
  .top { background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
}
#app { position: relative; z-index: 1; }
.logo-bg { fill: var(--ink); }
.logo-lines { stroke: var(--bg); }
.logo-mark { fill: var(--mark); }
.tools { display: flex; align-items: center; gap: 10px; flex: none; }
.seg { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; height: 40px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px; background: var(--accent); transition: transform 0.35s cubic-bezier(0.65, 0, 0.35, 1), background-color 0.8s !important; }
.seg[data-lang="en"]::before { transform: translateX(100%); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 0 12px; border-radius: 999px; font: 600 12px var(--font-mono); letter-spacing: 0.06em; color: var(--muted); transition: color 0.3s; }
.seg button[aria-pressed="true"] { color: var(--accent-ink); }
.tbtn { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; overflow: hidden; padding: 0; }
.tbtn:hover { border-color: var(--accent); }
.tbtn svg { grid-area: 1 / 1; width: 22px; height: 22px; transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.45s ease !important; }
.ti-sun { color: var(--sun-ink); }
.ti-moon { color: var(--moon-ink); transform: rotate(-110deg) scale(0.2); opacity: 0; }
.tbtn[data-dark="true"] .ti-sun { transform: rotate(110deg) scale(0.2); opacity: 0; }
.tbtn[data-dark="true"] .ti-moon { transform: none; opacity: 1; }
.tbtn[data-dark="true"] { background: var(--soft); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; padding: 6px 0; text-align: left; }
.brand b { font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand .pn { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 36ch; padding-left: 10px; border-left: 1px solid var(--line); }
.timer-wrap { position: relative; flex: none; }
.chip { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chip svg { width: 26px; height: 26px; transform: rotate(-90deg); }
.chip .trk { stroke: var(--line); fill: none; }
.chip .prg { stroke: var(--accent); fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
.chip.on { border-color: var(--accent); }
.chip[data-mode="break"] .prg { stroke: var(--warn); }
.chip.alert { animation: pulse 1.2s ease-in-out infinite; }
#chipText { font: 500 15px var(--font-mono); font-variant-numeric: tabular-nums; }
.chip small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px var(--soft); } }

#timerPanel { position: absolute; right: 0; top: calc(100% + 10px); width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 14px 34px rgb(10 20 50 / 0.18); display: grid; gap: 14px; }
.t-head { display: flex; justify-content: space-between; align-items: baseline; }
.eyebrow { font: 500 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
#tBig { font: 500 60px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; text-align: center; padding-block: 4px; }
.t-btns { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.pill:hover { border-color: var(--accent); }
.t-custom { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.t-custom label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.t-custom input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: 500 15px var(--font-mono); }
#tStats { font-size: 13px; color: var(--muted); }
#tMsg { font-size: 14px; background: var(--good-bg); color: var(--ink); border-radius: 8px; padding: 9px 11px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 16px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.again { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: 0.5; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

/* shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; padding-block: 28px 72px; align-items: start; }
.rail { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow: auto; }
.rail-h { margin: 18px 10px 6px; font: 500 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.rail-list { display: flex; flex-direction: column; gap: 2px; }
.nav-i { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--ink); }
.nav-i:hover { background: var(--soft); }
.nav-i.cur { background: var(--ink); color: var(--bg); font-weight: 600; }
.dot { flex: none; width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5.5px); mask: radial-gradient(circle, transparent 4.5px, #000 5.5px); }
.nav-i.cur .dot { background: conic-gradient(var(--bg) calc(var(--p) * 1%), color-mix(in srgb, var(--bg) 28%, transparent) 0); }
.main { min-width: 0; }

.page-h { font-size: clamp(27px, 4.4vw, 42px); margin: 10px 0 8px; }
.lede { color: var(--muted); max-width: 62ch; }
.tag { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; background: var(--mark); color: var(--ink); padding: 3px 6px; border-radius: 4px; margin-left: 6px; }
.note { margin-top: 16px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface); max-width: 70ch; }
.note details summary { cursor: pointer; font-weight: 600; }
.note ul { margin: 8px 0 0; padding-left: 1.2em; color: var(--muted); }
.note.err { border-style: solid; border-color: var(--bad); background: var(--bad-bg); }

/* overview */
.prog { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; margin-top: 24px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.big { font: 700 68px/1 var(--font-ui); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.big span { font-size: 30px; color: var(--muted); letter-spacing: 0; }
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 14px 0 16px; }
.stats div { display: grid; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sec-h { margin: 34px 0 12px; font-size: 20px; }
.tlist { display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; align-items: center; }
.trow:hover { border-color: var(--accent); }
.trow h3 { font-size: 17px; margin-bottom: 3px; }
.trow p { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meters { display: grid; gap: 7px; }
.m { display: grid; grid-template-columns: 62px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 12px; }
.m-l { color: var(--muted); }
.m-b { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.m-b i { display: block; height: 100%; background: var(--accent); }
.m-v { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.m.na .m-v { color: var(--muted); }
.foot { margin-top: 28px; font-size: 13px; color: var(--muted); }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 20px 0 24px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* notes */
.notes { max-width: 68ch; }
.notes .sum { font: 19px/1.55 var(--font-read); color: var(--muted); margin-bottom: 8px; }
.notes h3 { font-size: 19px; margin: 30px 0 10px; }
.notes ul { margin: 0; padding-left: 1.2em; font: 17px/1.65 var(--font-read); }
.notes li + li { margin-top: 8px; }
.terms { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 10px 22px; margin: 0; max-width: 68ch; }
.terms dt { font-weight: 700; }
.terms dd { margin: 0; font: 16px/1.55 var(--font-read); }
.done-row { margin-top: 32px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* flashcards */
.deck { display: grid; gap: 16px; max-width: 640px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 14px; }
.ctrl label { display: inline-flex; gap: 8px; align-items: center; }
.ctrl .sp { margin-left: auto; }
.prog-line { display: flex; justify-content: space-between; font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.card-wrap { perspective: 1200px; }
.card { width: 100%; cursor: pointer; }
.inner { display: grid; transition: transform 0.45s; transform-style: preserve-3d; }
.card.flipped .inner { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; min-height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; font: 600 clamp(19px, 3.4vw, 24px) / 1.35 var(--font-ui); text-align: center; overflow-wrap: anywhere; }
.face.back { transform: rotateY(180deg); background: var(--soft); }
.face small { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.hint { text-align: center; color: var(--muted); font-size: 13px; }
.rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rate .btn { padding: 13px; }
.empty { padding: 36px 20px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; display: grid; gap: 12px; justify-items: center; }

/* quiz */
.qset { display: grid; gap: 16px; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.qset label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
.qset select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.qset .chk { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.quiz { max-width: 720px; display: grid; gap: 16px; }
.q-top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font: 500 13px var(--font-mono); color: var(--muted); }
.q-top .grow { flex: 1; }
.qtimer { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.qtimer .bar { width: 90px; height: 6px; }
.qtimer .bar i { background: var(--warn); transition: width 0.2s linear; }
.q-prog { display: flex; gap: 3px; }
.q-prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.q-prog i.d { background: var(--accent); }
.q-prog i.w { background: var(--bad); }
.q-p { font-size: clamp(20px, 3.4vw, 26px); line-height: 1.3; letter-spacing: -0.01em; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { font: 500 12px var(--font-mono); width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.opt .lab { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.ok .lab { color: var(--good); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .lab { color: var(--bad); }
.typed { width: 100%; min-height: 96px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); resize: vertical; }
.fb { display: grid; gap: 10px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.fb.ok { border-color: var(--good); }
.fb.bad { border-color: var(--bad); }
.fb h3 { font-size: 16px; }
.fb.ok h3 { color: var(--good); }
.fb.bad h3 { color: var(--bad); }
.model { font: 16px/1.55 var(--font-read); padding: 10px 12px; background: var(--soft); border-radius: 8px; }
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score .big { font-size: 72px; }
.res-list { display: grid; gap: 10px; margin-top: 8px; }
.res-i { padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); display: grid; gap: 6px; }
.res-i p { font-size: 14px; color: var(--muted); }
.by { display: grid; gap: 6px; max-width: 520px; }

/* load + teacher */
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 34px 20px; text-align: center; background: var(--surface); display: grid; gap: 12px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--soft); }
.narrow { max-width: 720px; display: grid; gap: 22px; margin-top: 22px; }
.paste { width: 100%; min-height: 130px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); font: 13px/1.5 var(--font-mono); resize: vertical; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; max-width: 70ch; }
pre.prompt { margin: 0; max-height: 380px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.6 var(--font-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
table.f { border-collapse: collapse; min-width: 560px; width: 100%; font-size: 14px; background: var(--surface); }
table.f th, table.f td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.f th { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
table.f code { font-family: var(--font-mono); font-size: 13px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 16px 56px; }
  .rail { position: static; flex-direction: row; overflow-x: auto; max-height: none; padding-bottom: 6px; gap: 6px; }
  .rail-h { display: none; }
  .rail-list { display: contents; }
  .nav-i { width: auto; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); }
  .nav-i.cur { background: var(--ink); }
  .nav-i:hover { background: var(--soft); }
  .nav-i.cur:hover { background: var(--ink); }
  .trow { grid-template-columns: minmax(0, 1fr); }
  .prog { grid-template-columns: minmax(0, 1fr); gap: 16px; }
}
@media (max-width: 560px) {
  .brand .pn { display: none; }
  .chip small { display: none; }
  .terms { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .terms dd { margin-bottom: 10px; }
  .big { font-size: 56px; }
}
@media (max-width: 480px) {
  .brand b { display: none; }
  .tools { gap: 8px; }
  .seg button { padding: 0 10px; }
}

/* sky: sun and moon ride opposite ends of one rotating arm, so switching theme sets one and raises the other */

.wash { position: absolute; inset: 0; transition: opacity 1.1s ease !important; }

.wash.moon { background: radial-gradient(70vmax 55vmax at 92% 2%, var(--moon-glow), transparent 62%); opacity: 0; }
.sky.dark .wash.sun { opacity: 0; }
.sky.dark .wash.moon { opacity: 1; }

.orbit { position: absolute; right: max(6vw, 84px); top: calc(128px + var(--R)); width: 0; height: 0; }
.orb { position: absolute; width: var(--s); height: var(--s); left: calc(var(--s) / -2); top: calc(var(--s) / -2); }
.orb svg { width: 100%; height: 100%; overflow: visible; animation: bob 8s ease-in-out infinite; }
.orb.sun { transform: translateY(calc(-1 * var(--R))) rotate(0deg); }
.orb.moon { transform: translateY(var(--R)) rotate(0deg); }
.sky.dark .orbit { transform: rotate(180deg); }
.sky.dark .orb.sun { transform: translateY(calc(-1 * var(--R))) rotate(-180deg); }
.sky.dark .orb.moon { transform: translateY(var(--R)) rotate(-180deg); }

.rays { animation: spin 50s linear infinite; transform-origin: 0 0; }
.beams { position: absolute; left: 50%; top: 50%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%; background: repeating-conic-gradient(var(--beam) 0 5deg, transparent 5deg 20deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 66%); mask: radial-gradient(circle, #000 0, transparent 66%); animation: spin 180s linear infinite; }

@keyframes bob { 50% { transform: translateY(-5px); } }

<script type="text/plain" id="promptText">
You convert a teacher's Word document into a "Study Pack": one JSON file that a revision website loads. Follow every rule exactly so the output has the same shape every time.

OUTPUT RULES
1. Reply with one JSON object and nothing else. No introduction, no explanation, no Markdown code fence.
2. The JSON must be valid: double quotes around every key and string, no trailing commas, no comments. Escape a double quote inside a string as \" and avoid line breaks inside strings.
3. Use only information found in the document. Never add facts, dates, formulas or examples that are not in it. If the document has too little material for a target below, produce fewer items. Do not invent filler.
4. Write the content in the same language as the document. Keep every field name and every "type" value in English, exactly as shown.
5. If you would run out of space, stop adding topics and close the JSON properly. A shorter valid file is better than a long broken one. Only include complete topics.

FIELD GUIDE
Top level:
- "format": always "studypack".
- "version": always 1.
- "title", "subject", "level", "language": strings. Use "" when unknown. "language" is a code such as "en" or "vi".
- "topics": one topic per chapter or main heading of the document, in the document's order (usually 2 to 8).

Each topic has these fields, all present:
- "id": "t1", "t2", "t3", ... in order.
- "title": short heading taken from the document.
- "summary": one or two sentences, at most 40 words.
- "notes": 2 to 5 sections. Each section is {"heading": string, "points": [2 to 6 strings]}. Each point is one complete sentence of at most 30 words. Put the most important term of a point inside **double asterisks**, at most two per point. This is the only formatting allowed.
- "key_terms": 3 to 8 items {"term": string, "definition": string}. One-sentence definitions.
- "flashcards": 5 to 12 items {"front": string, "back": string}. The front is a question or a term. The back is a short answer of at most 25 words. One idea per card.
- "questions": 5 to 10 items, about 60% "mcq", 20% "truefalse", 20% "short", ordered from easy to hard. Question types:
  - mcq: {"type": "mcq", "prompt": string, "options": [exactly 4 strings], "answer": 0-based index of the correct option, "explanation": string}. One option is clearly correct. Distractors are plausible and come from the same topic. Never use "all of the above" or "none of the above". Vary the position of the correct option from question to question.
  - truefalse: {"type": "truefalse", "prompt": a full statement, "answer": true or false as a JSON boolean, "explanation": string}. Roughly half of the statements are false.
  - short: {"type": "short", "prompt": string, "answer": model answer in one or two sentences, "explanation": string or ""}.
  - Every question must be answerable from that topic's notes. Never write "according to the text" or refer to the document.
  - "explanation" is one or two sentences saying why the answer is right.

CONTENT FORMAT
- Plain text only, apart from **bold** around key terms in notes points. No HTML, no LaTeX, no Markdown headings, bullets or tables inside strings.
- Write formulas and units in plain text: CO2, H2O, m/s^2, x^2, 6CO2 + 6H2O -> C6H12O6 + 6O2.
- Turn tables in the document into note points or flashcards.
- Ignore pictures, page numbers, headers and footers.
- Condense. Do not copy long passages word for word.

CHECK BEFORE YOU REPLY (silently)
- The reply starts with { and ends with }.
- Every mcq has exactly 4 options and an integer "answer" from 0 to 3.
- Every truefalse "answer" is true or false without quotation marks.
- Topic ids are unique and no field is missing. Use "" or [] when a field is empty.
- Nothing in the file is absent from the document.

EXAMPLE OF THE EXACT SHAPE (one short topic; your file contains all topics)
{
  "format": "studypack",
  "version": 1,
  "title": "Cells and Energy",
  "subject": "Biology",
  "level": "Grade 10",
  "language": "en",
  "topics": [
    {
      "id": "t1",
      "title": "Cell structure",
      "summary": "Animal and plant cells share most parts. Plant cells also have a cell wall, a vacuole and chloroplasts.",
      "notes": [
        {
          "heading": "Parts of the cell",
          "points": [
            "The **nucleus** contains DNA and controls the activities of the cell.",
            "**Mitochondria** are where aerobic respiration releases energy."
          ]
        }
      ],
      "key_terms": [
        {"term": "Nucleus", "definition": "The part of the cell that contains DNA and controls its activities."}
      ],
      "flashcards": [
        {"front": "Where does aerobic respiration happen in a cell?", "back": "In the mitochondria."}
      ],
      "questions": [
        {"type": "mcq", "prompt": "Which structure controls the activities of the cell?", "options": ["Cell wall", "Nucleus", "Chloroplast", "Cell membrane"], "answer": 1, "explanation": "The nucleus holds the DNA, which carries the instructions for the cell."},
        {"type": "truefalse", "prompt": "Animal cells have a cell wall made of cellulose.", "answer": false, "explanation": "Only plant cells have a cellulose cell wall."},
        {"type": "short", "prompt": "Name two structures found in plant cells but not in animal cells.", "answer": "Any two of: cell wall, permanent vacuole, chloroplasts.", "explanation": ""}
      ]
    }
  ]
}

END OF INSTRUCTIONS. The Word document follows, attached or pasted below.

</script>

/* Core: parsing, validation, merging and hashing of study packs. Pure functions.
   Problems are returned as {key, vars} objects so the app can show them in the chosen language. */
function spMsg(key, vars) { return { key: key, vars: vars || {} }; }

function spStr(v) {
  if (typeof v === 'string') return v.trim();
  if (typeof v === 'number' && isFinite(v)) return String(v);
  return '';
}

function spParse(text) {
  var t = String(text == null ? '' : text).replace(/^﻿/, '').trim();
  if (!t) return { error: spMsg('empty') };
  var fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  var a = t.indexOf('{');
  var b = t.lastIndexOf('}');
  if (a >= 0 && b > a && (a > 0 || b < t.length - 1)) t = t.slice(a, b + 1);
  try {
    return { data: JSON.parse(t) };
  } catch (e) {
    return { error: spMsg('badjson', { d: e.message }) };
  }
}

function spNormalise(data) {
  var errors = [];
  var warnings = [];
  if (!data || typeof data !== 'object' || !Array.isArray(data.topics) || !data.topics.length) {
    errors.push(spMsg('notopics'));
    return { errors: errors, warnings: warnings };
  }
  var pack = {
    title: spStr(data.title) || 'Untitled study pack',
    subject: spStr(data.subject),
    level: spStr(data.level),
    language: spStr(data.language),
    topics: []
  };
  var used = {};
  data.topics.forEach(function (t, ti) {
    var n = ti + 1;
    if (!t || typeof t !== 'object') { warnings.push(spMsg('topic_obj', { n: n })); return; }
    var title = spStr(t.title);
    if (!title) { warnings.push(spMsg('topic_title', { n: n })); return; }
    var id = (spStr(t.id) || ('t' + n)).replace(/\s+/g, '-');
    var base = id, k = 2;
    while (used[id]) { id = base + '-' + k++; }
    used[id] = true;
    var topic = { id: id, title: title, summary: spStr(t.summary), notes: [], terms: [], cards: [], questions: [] };
    var at = function (key, s, extra) {
      var v = { n: n, t: title, s: s };
      for (var x in (extra || {})) v[x] = extra[x];
      warnings.push(spMsg(key, v));
    };

    (Array.isArray(t.notes) ? t.notes : []).forEach(function (s, si) {
      var pts = (s && Array.isArray(s.points) ? s.points : []).map(spStr).filter(Boolean);
      if (!pts.length) { at('note_empty', si + 1); return; }
      topic.notes.push({ heading: spStr(s.heading), points: pts });
    });

    (Array.isArray(t.key_terms) ? t.key_terms : []).forEach(function (kt, ki) {
      var term = spStr(kt && kt.term), def = spStr(kt && kt.definition);
      if (!term || !def) { at('term_bad', ki + 1); return; }
      topic.terms.push({ term: term, definition: def });
    });

    (Array.isArray(t.flashcards) ? t.flashcards : []).forEach(function (c, ci) {
      var f = spStr(c && c.front), b = spStr(c && c.back);
      if (!f || !b) { at('card_bad', ci + 1); return; }
      topic.cards.push({ front: f, back: b });
    });

    (Array.isArray(t.questions) ? t.questions : []).forEach(function (q, qi) {
      var s = qi + 1;
      if (!q || typeof q !== 'object') { at('q_obj', s); return; }
      var type = spStr(q.type).toLowerCase();
      var prompt = spStr(q.prompt);
      var expl = spStr(q.explanation);
      if (!prompt) { at('q_prompt', s); return; }
      if (type === 'mcq') {
        var opts = (Array.isArray(q.options) ? q.options : []).map(spStr).filter(Boolean);
        var ans = typeof q.answer === 'number' ? q.answer : parseInt(q.answer, 10);
        if (opts.length < 2) { at('q_opts', s); return; }
        if (!Number.isInteger(ans) || ans < 0 || ans >= opts.length) { at('q_idx', s, { max: opts.length - 1 }); return; }
        topic.questions.push({ type: 'mcq', prompt: prompt, options: opts, answer: ans, explanation: expl });
      } else if (type === 'truefalse') {
        var a = q.answer;
        if (typeof a === 'string') a = a.trim().toLowerCase() === 'true' ? true : a.trim().toLowerCase() === 'false' ? false : null;
        if (typeof a !== 'boolean') { at('q_tf', s); return; }
        topic.questions.push({ type: 'truefalse', prompt: prompt, answer: a, explanation: expl });
      } else if (type === 'short') {
        var sa = spStr(q.answer);
        if (!sa) { at('q_short', s); return; }
        topic.questions.push({ type: 'short', prompt: prompt, answer: sa, explanation: expl });
      } else {
        at('q_type', s, { type: type });
      }
    });

    pack.topics.push(topic);
  });

  var items = 0;
  pack.topics.forEach(function (t) { items += t.notes.length + t.cards.length + t.questions.length; });
  if (!pack.topics.length || !items) {
    errors.push(spMsg('noitems'));
    return { errors: errors, warnings: warnings };
  }
  return { pack: pack, errors: errors, warnings: warnings };
}

function spMerge(packs) {
  if (packs.length === 1) return packs[0];
  var titles = [];
  packs.forEach(function (p) { if (titles.indexOf(p.title) < 0) titles.push(p.title); });
  var title = titles.length <= 2 ? titles.join(' + ') : titles[0] + ' + ' + (titles.length - 1) + ' more';
  var pick = function (k) { for (var i = 0; i < packs.length; i++) if (packs[i][k]) return packs[i][k]; return ''; };
  var out = { title: title, subject: pick('subject'), level: pick('level'), language: pick('language'), topics: [] };
  var used = {};
  packs.forEach(function (p) {
    p.topics.forEach(function (t) {
      var id = t.id, base = id, n = 2;
      while (used[id]) { id = base + '-' + n++; }
      used[id] = true;
      var copy = {};
      for (var k in t) copy[k] = t[k];
      copy.id = id;
      out.topics.push(copy);
    });
  });
  return out;
}

function spHash(s) {
  var h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { spStr: spStr, spParse: spParse, spNormalise: spNormalise, spMerge: spMerge, spHash: spHash };
}

/* App: state, rendering, language, theme, focus timer. Uses I18N (i18n.js) and the spXxx helpers (core.js). */
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var rich = function (s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>'); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  };
  var shuffle = function (a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };

  /* ---------- language ---------- */
  var LANG = 'en';
  function tr(key, vars) {
    var d = I18N[LANG] || I18N.en, v = d[key];
    if (v == null) v = I18N.en[key];
    if (v == null) return key;
    if (Array.isArray(v)) v = (vars && vars.n === 1) ? v[0] : v[1];
    return String(v).replace(/\{(\w+)\}/g, function (m, k) { return vars && k in vars ? vars[k] : m; });
  }
  function detectLang() {
    var s = store.get('sp:lang');
    if (s === 'vi' || s === 'en') return s;
    var n = String((typeof navigator !== 'undefined' && navigator.language) || 'en').toLowerCase();
    return n.indexOf('vi') === 0 ? 'vi' : 'en';
  }
  function applyStatic() {
    document.documentElement.lang = LANG;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
      el.textContent = tr(el.getAttribute('data-i18n'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-attr]'), function (el) {
      el.getAttribute('data-i18n-attr').split(';').forEach(function (p) {
        var kv = p.split(':'); el.setAttribute(kv[0], tr(kv[1]));
      });
    });
    $('#langSeg').dataset.lang = LANG;
    Array.prototype.forEach.call(document.querySelectorAll('[data-l]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === LANG));
    });
  }
  function msgText(x) {
    return (x.file ? esc(x.file) + ': ' : '') + esc(tr('v_' + x.m.key, x.m.vars));
  }

  var S = {
    pack: null, key: '', sample: false, prog: null,
    view: 'overview', scope: 'all', mode: 'notes',
    cards: null, quiz: null, qiv: null,
    qopts: { count: 10, secs: 0, shuffle: true },
    copts: { shuffle: true, skipKnown: false },
    notice: null, loadMsg: null, confirmReset: false
  };

  /* ---------- pack + progress ---------- */
  function sampleFor(lang) {
    return spNormalise(JSON.parse($(lang === 'vi' ? '#sampleVi' : '#sampleEn').textContent)).pack;
  }
  function setPack(pack, sample) {
    S.pack = pack; S.sample = !!sample;
    S.key = sample ? 'example' : spHash(pack.title + '|' + pack.topics.map(function (t) { return t.id + ':' + t.title; }).join('|'));
    var p = null;
    try { p = JSON.parse(store.get('sp:prog:' + S.key) || 'null'); } catch (e) { p = null; }
    S.prog = { notes: {}, cards: {}, quiz: {} };
    if (p && typeof p === 'object') {
      ['notes', 'cards', 'quiz'].forEach(function (k) { if (p[k] && typeof p[k] === 'object') S.prog[k] = p[k]; });
    }
    S.cards = null; S.quiz = null; S.confirmReset = false; stopQT();
    store.set('sp:pack', sample ? '' : JSON.stringify(pack));
    $('#packName').textContent = pack.title;
  }
  function saveProg() { store.set('sp:prog:' + S.key, JSON.stringify(S.prog)); }
  function scopeTopics(scope) { return scope === 'all' ? S.pack.topics : S.pack.topics.filter(function (t) { return t.id === scope; }); }

  function topicStats(t) {
    var known = 0;
    t.cards.forEach(function (_, i) { if (S.prog.cards[t.id + ':' + i]) known++; });
    var best = S.prog.quiz[t.id];
    var comps = [];
    if (t.notes.length) comps.push(S.prog.notes[t.id] ? 1 : 0);
    if (t.cards.length) comps.push(known / t.cards.length);
    if (t.questions.length) comps.push(best == null ? 0 : best / 100);

    return { known: known, best: best, ready: ready };

  function totals() {

    S.pack.topics.forEach(function (t) {
      var st = topicStats(t);
      o.cards += t.cards.length; o.known += st.known; o.qs += t.questions.length; o.ready += st.ready;

  /* ---------- loading files ---------- */
  function loadTexts(items) {
    var packs = [], errs = [], warns = [];
    items.forEach(function (it) {
      var file = items.length > 1 || it.name ? it.name : '';
      var r = spParse(it.text);
      if (r.error) { errs.push({ file: file, m: r.error }); return; }
      var n = spNormalise(r.data);
      n.warnings.forEach(function (w) { warns.push({ file: items.length > 1 ? it.name : '', m: w }); });
      if (n.errors.length) { n.errors.forEach(function (e) { errs.push({ file: file, m: e }); }); return; }
      packs.push(n.pack);
    });
    if (!packs.length) { S.loadMsg = { errors: errs, warnings: warns }; S.view = 'load'; render(); return; }
    setPack(spMerge(packs), false);
    S.notice = { topics: S.pack.topics.length, files: items.length > 1 ? packs.length : 0, items: errs.concat(warns) };
    S.loadMsg = null;
    go('overview');
  }
  function handleFiles(files) {

    Promise.all(list.map(function (f) {

  function loadSample() {

  /* ---------- quiz ---------- */
  function stopQT() { if (S.qiv) { clearInterval(S.qiv); S.qiv = null; } }
  function armQT() {
    stopQT();
    var q = S.quiz;
    if (!q || q.done || q.phase !== 'ask' || !S.qopts.secs) return;
    q.deadline = Date.now() + S.qopts.secs * 1000;
    S.qiv = setInterval(tickQ, 200);
  }
  function tickQ() {
    var q = S.quiz;
    if (!q || q.done || q.phase !== 'ask') { stopQT(); return; }
    var left = Math.max(0, q.deadline - Date.now());
    var el = $('#qTime'), bar = $('#qBar');
    if (el) el.textContent = Math.ceil(left / 1000) + 's';
    if (bar) bar.style.width = (left / (S.qopts.secs * 1000) * 100) + '%';
    if (left <= 0) { stopQT(); timeUp(); }
  }
  function startQuiz(scope, items) {
    if (!items) {
      items = [];
      scopeTopics(scope).forEach(function (t) {
        t.questions.forEach(function (q) { items.push({ tid: t.id, ttitle: t.title, q: q }); });
      });
      if (S.qopts.shuffle) shuffle(items);
      if (S.qopts.count > 0) items = items.slice(0, S.qopts.count);
    }
    items.forEach(function (it) {
      it.res = null; it.typed = ''; it.revealed = false; it.timedOut = false;
      if (it.q.type === 'mcq') { it.order = it.q.options.map(function (_, i) { return i; }); if (S.qopts.shuffle) shuffle(it.order); }
    });
    if (!items.length) return;

    armQT(); render();
  }
  function curItem() { return S.quiz.items[S.quiz.i]; }
  function answer(pos) {
    var q = S.quiz; if (!q || q.phase !== 'ask') return;
    var it = curItem(), t = it.q, ok = false;
    if (t.type === 'mcq') ok = it.order[pos] === t.answer;
    else if (t.type === 'truefalse') ok = pos === (t.answer ? 0 : 1);
    it.res = { pos: pos, correct: ok, timedOut: false };
    q.phase = 'fb'; stopQT(); render();
  }
  function timeUp() {
    var q = S.quiz; if (!q || q.phase !== 'ask') return;
    var it = curItem();
    if (it.q.type === 'short') { it.revealed = true; it.timedOut = true; }
    else it.res = { pos: -1, correct: false, timedOut: true };
    q.phase = 'fb'; render();

  function revealShort() {

  function gradeShort(ok) {

  function nextQ() {

  function finishQuiz() {

  function fmtTime(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function quizResultHTML() {
    var q = S.quiz, n = q.items.length, pct = Math.round(q.ok / n * 100);
    var missed = q.items.filter(function (it) { return !(it.res && it.res.correct); });
    var h = '<div class="quiz"><div class="score"><div class="big">' + pct + '<span>%</span></div><div><h2>' + tr('n_correct', { k: q.ok, n: n }) + '</h2><p class="muted">' + tr('time_taken', { t: fmtTime(q.elapsed) }) + '</p></div></div>';
    var ids = Object.keys(q.by);
    if (ids.length > 1) {
      h += '<div class="by">' + ids.map(function (id) { var b = q.by[id]; return meter(esc(b.title).slice(0, 40), Math.round(b.ok / b.n * 100), b.ok + '/' + b.n); }).join('') + '</div>';
    }
    h += '<div class="actions">';
    if (missed.length) h += '<button class="btn primary" data-act="retry">' + tr('retry_missed', { n: missed.length }) + '</button>';
    h += '<button class="btn' + (missed.length ? '' : ' primary') + '" data-act="newquiz">' + tr('new_quiz') + '</button></div>';
    if (missed.length) {
      h += '<h2 class="sec-h">' + tr('to_review') + '</h2><div class="res-list">' + missed.map(function (it) {
        var t = it.q, ans = t.type === 'mcq' ? t.options[t.answer] : t.type === 'truefalse' ? (t.answer ? tr('tf_true') : tr('tf_false')) : t.answer;
        return '<div class="res-i"><b>' + esc(t.prompt) + '</b><p>' + tr('answer_is', { a: esc(ans) }) + '</p>' + (t.explanation ? '<p>' + esc(t.explanation) + '</p>' : '') + '</div>';
      }).join('') + '</div>';
    }
    return h + '</div>';
  }

  /* ---------- load + teacher views ---------- */
  function msgHTML() {
    var m = S.loadMsg; if (!m) return '';
    var h = '<div class="note err"><b>' + tr('err_title') + '</b><ul>' + m.errors.map(function (e) { return '<li>' + msgText(e) + '</li>'; }).join('') + '</ul>';
    if (m.warnings.length) h += '<details><summary>' + tr('other_issues', { n: m.warnings.length }) + '</summary><ul>' + m.warnings.map(function (e) { return '<li>' + msgText(e) + '</li>'; }).join('') + '</ul></details>';
    return h + '</div>';
  }
  function loadHTML() {
    var h = '<div class="eyebrow">' + tr('nav_files') + '</div><h1 class="page-h">' + tr('load_h') + '</h1>';
    h += '<p class="lede">' + tr('load_lede') + '</p><div class="narrow">';
    h += msgHTML();
    h += '<div class="drop" id="drop"><p><b>' + tr('drop_h') + '</b></p><p class="muted">' + tr('drop_sub') + '</p><button class="btn primary" data-act="pickfile">' + tr('choose_files') + '</button><input type="file" id="fileIn" accept=".json,.txt,application/json,text/plain" multiple hidden></div>';
    h += '<div><label for="pasteIn" style="font-weight:600">' + tr('paste_label') + '</label><textarea class="paste" id="pasteIn" placeholder="{ &quot;format&quot;: &quot;studypack&quot;, ... }" style="margin-top:8px"></textarea><div style="margin-top:8px"><button class="btn" data-act="loadpaste">' + tr('load_pasted') + '</button></div></div>';
    h += '<p class="muted">' + tr('local_note') + ' <button class="link" data-act="sample">' + tr('use_example') + '</button></p></div>';
    return h;
  }
  function teacherHTML() {
    var prompt = $('#promptText').textContent.trim();
    var h = '<div class="eyebrow">' + tr('teach_eyebrow') + '</div><h1 class="page-h">' + tr('teach_h') + '</h1>';
    h += '<p class="lede">' + tr('teach_lede') + '</p><div class="narrow">';
    h += '<ol class="steps"><li>' + tr('s1') + '</li><li>' + tr('s2') + '</li><li>' + tr('s3', { code: '<code>.json</code>', ex: '<code>chapter-1.studypack.json</code>' }) + '</li><li>' + tr('s4', { link: '<button class="link" data-go="load">' + tr('nav_open') + '</button>' }) + '</li></ol>';
    h += '<div><h2 class="sec-h" style="margin-top:0">' + tr('prompt_h') + '</h2><p class="muted" style="margin-bottom:10px">' + tr('prompt_note') + '</p><div class="row-btns"><button class="btn primary" data-act="copyprompt">' + tr('copy_prompt') + '</button></div><pre class="prompt" id="promptPre">' + esc(prompt) + '</pre></div>';
    h += '<div><h2 class="sec-h" style="margin-top:0">' + tr('contains_h') + '</h2><div class="scroll"><table class="f"><thead><tr><th>' + tr('th_field') + '</th><th>' + tr('th_type') + '</th><th>' + tr('th_meaning') + '</th></tr></thead><tbody>';
    [['title, subject, level, language', 'type_text', 'row1'],
     ['topics[]', 'type_list', 'row2'],
     ['notes[]', 'type_list', 'row3'],
     ['key_terms[]', 'type_list', 'row4'],
     ['flashcards[]', 'type_list', 'row5'],
     ['questions[]', 'type_list', 'row6']].forEach(function (r) {
      h += '<tr><td><code>' + esc(r[0]) + '</code></td><td>' + tr(r[1]) + '</td><td>' + esc(tr(r[2])) + '</td></tr>';
    });
    h += '</tbody></table></div></div></div>';
    return h;
  }

  /* ---------- events ---------- */
  function flash(btn, text) {
    if (!btn) return;
    var old = btn.textContent; btn.textContent = text;
    setTimeout(function () { if (btn.isConnected) btn.textContent = old; }, 1600);
  }
  function copyPrompt(btn) {
    var text = $('#promptText').textContent.trim();
    var fallback = function () {
      var pre = $('#promptPre'); if (!pre) return;
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      flash(btn, tr('selected'));
    };
    try { navigator.clipboard.writeText(text).then(function () { flash(btn, tr('copied')); }, fallback); } catch (e) { fallback(); }
  }

  function setLang(l) {
    if (l !== 'vi' && l !== 'en') return;
    LANG = l; store.set('sp:lang', l);
    applyStatic(); syncTheme(); tRender();
    if (S.sample) { setPack(sampleFor(LANG), true); S.notice = null; }
    if (S.pack) $('#packName').textContent = S.pack.title;
    render();
  }

  function act(name, el) {
    switch (name) {
      case 'lang': setLang(el.dataset.l); break;
      case 'theme': toggleTheme(); break;
      case 'tab': S.mode = el.dataset.mode; stopQT(); S.quiz = null; render(); window.scrollTo(0, 0); break;
      case 'notesDone': S.prog.notes[el.dataset.id] = !S.prog.notes[el.dataset.id]; if (!S.prog.notes[el.dataset.id]) delete S.prog.notes[el.dataset.id]; saveProg(); render(); break;
      case 'flip': if (S.cards) { S.cards.flipped = !S.cards.flipped; var c = $('#theCard'); if (c) c.classList.toggle('flipped', S.cards.flipped); } break;
      case 'gotit': case 'again': cardRate(name === 'gotit'); break;
      case 'restartCards': startCards(S.scope); render(); break;
      case 'restartAll': S.copts.skipKnown = false; startCards(S.scope); render(); break;
      case 'qstart':
        S.qopts.count = parseInt($('#qCount').value, 10) || 0;
        S.qopts.secs = parseInt($('#qTimeSel').value, 10) || 0;
        S.qopts.shuffle = $('#qShuffle').checked;
        startQuiz(S.scope); break;
      case 'pick': answer(parseInt(el.dataset.i, 10)); break;
      case 'reveal': revealShort(); break;
      case 'grade': gradeShort(el.dataset.ok === '1'); break;
      case 'next': nextQ(); break;
      case 'retry':
        startQuiz(S.quiz.scope, S.quiz.items.filter(function (it) { return !(it.res && it.res.correct); }).map(function (it) { return { tid: it.tid, ttitle: it.ttitle, q: it.q }; }));
        break;
      case 'newquiz': S.quiz = null; stopQT(); render(); break;
      case 'dismiss': S.notice = null; render(); break;
      case 'reset':
        if (!S.confirmReset) { S.confirmReset = true; render(); break; }
        S.prog = { notes: {}, cards: {}, quiz: {} }; saveProg(); S.confirmReset = false; S.cards = null; render(); break;
      case 'pickfile': var fi = $('#fileIn'); if (fi) fi.click(); break;
      case 'loadpaste': var ta = $('#pasteIn'); if (ta && ta.value.trim()) loadTexts([{ name: tr('pasted_name'), text: ta.value }]); break;
      case 'sample': loadSample(); break;
      case 'copyprompt': copyPrompt(el); break;
      case 'focus': openPanel(true); if (!T.running) tStart(); break;
    }
  }
  function cardRate(known) {
    var C = S.cards; if (!C || !C.queue.length) return;
    var c = C.queue.shift();
    if (known) { S.prog.cards[c.id] = true; C.got++; }
    else { delete S.prog.cards[c.id]; C.again++; C.queue.push(c); }
    C.flipped = false; saveProg(); render();
  }

  document.addEventListener('click', function (e) {
    var panel = $('#timerPanel');
    if (panel && !panel.hidden && !e.target.closest('.timer-wrap')) openPanel(false);
    var el = e.target.closest('[data-act],[data-go]');
    if (!el) return;
    if (el.dataset.go) go(el.dataset.go, el.dataset.id, el.dataset.mode);
    else act(el.dataset.act, el);
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'cShuffle') { S.copts.shuffle = e.target.checked; startCards(S.scope); render(); }
    else if (id === 'cSkip') { S.copts.skipKnown = e.target.checked; startCards(S.scope); render(); }
    else if (id === 'fileIn') handleFiles(e.target.files);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'typed' && S.quiz && !S.quiz.done) curItem().typed = e.target.value;
  });
  document.addEventListener('dragover', function (e) {
    var d = e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); }
  });
  document.addEventListener('dragleave', function (e) {
    var d = e.target.closest('.drop'); if (d) d.classList.remove('over');
  });
  document.addEventListener('drop', function (e) {
    var d = e.target.closest('.drop');
    if (d) { e.preventDefault(); d.classList.remove('over'); handleFiles(e.dataTransfer.files); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { var p = $('#timerPanel'); if (p && !p.hidden) { openPanel(false); $('#timerChip').focus(); } return; }
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (S.view !== 'study') return;
    if (S.mode === 'cards' && S.cards && S.cards.queue.length) {
      if (e.key === ' ' || (e.key === 'Enter' && tag !== 'button')) { e.preventDefault(); act('flip'); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); cardRate(false); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); cardRate(true); }
    } else if (S.mode === 'quiz' && S.quiz && !S.quiz.done) {
      var it = curItem(), t = it.q;
      if (S.quiz.phase === 'ask' && t.type !== 'short') {
        var k = e.key.toLowerCase(), pos = -1;
        if (t.type === 'mcq') pos = 'abcd'.indexOf(k) >= 0 && k.length === 1 ? 'abcd'.indexOf(k) : ('1234'.indexOf(k) >= 0 && k.length === 1 ? '1234'.indexOf(k) : -1);
        else pos = k === 't' || k === '1' ? 0 : (k === 'f' || k === '2' ? 1 : -1);
        if (pos >= 0 && pos < (t.type === 'mcq' ? t.options.length : 2)) answer(pos);
      } else if (S.quiz.phase === 'fb' && t.type !== 'short' && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault(); nextQ();
      }
    }
  });

  /* ---------- light / dark theme ---------- */
  var root = document.documentElement;
  var mq = (typeof window !== 'undefined' && window.matchMedia) ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var themeTimer = null;
  function isDark() {
    var a = root.getAttribute('data-theme');
    return a === 'dark' || (a !== 'light' && !!(mq && mq.matches));
  }
  function syncTheme() {
    var d = isDark(), btn = $('#themeBtn');
    $('#sky').classList.toggle('dark', d);
    btn.dataset.dark = String(d);
    var label = tr(d ? 'theme_to_light' : 'theme_to_dark');
    btn.setAttribute('aria-label', label); btn.setAttribute('title', label);
  }
  function toggleTheme() {
    var next = isDark() ? 'light' : 'dark';
    root.classList.add('theme-anim');
    root.setAttribute('data-theme', next);
    store.set('sp:theme', next);
    syncTheme();
    clearTimeout(themeTimer);
    themeTimer = setTimeout(function () { root.classList.remove('theme-anim'); }, 1500);
  }
  function makeStars() {
    var host = $('#stars'), frag = document.createDocumentFragment();
    for (var i = 0; i < 64; i++) {
      var s = document.createElement('i'), r = Math.random();
      var size = r < 0.12 ? 3 : (r < 0.45 ? 2 : 1.5);
      s.style.cssText = 'left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 100).toFixed(1) + '%;width:' + size + 'px;height:' + size + 'px;--d:' + (2.5 + Math.random() * 4).toFixed(1) + 's;--dl:-' + (Math.random() * 6).toFixed(1) + 's';
      frag.appendChild(s);
    }
    host.appendChild(frag);
  }
  function initTheme() {
    var saved = store.get('sp:theme');
    if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
    makeStars();
    syncTheme();
    var raf = window.requestAnimationFrame || function (f) { setTimeout(f, 16); };
    raf(function () { raf(function () { $('#sky').classList.add('ready'); }); });
    if (mq) { if (mq.addEventListener) mq.addEventListener('change', syncTheme); else if (mq.addListener) mq.addListener(syncTheme); }
    if (window.MutationObserver) new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  }

  /* ---------- focus timer ---------- */
  var T = { focus: 25, brk: 5, mode: 'focus', left: 1500, running: false, endsAt: 0, iv: null, ctx: null, msg: '' };
  var RING = 62.83;
  function tDur() { return (T.mode === 'focus' ? T.focus : T.brk) * 60; }
  function tFmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function dayKey() { var d = new Date(); return 'sp:timer:' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function dayStats() { try { return JSON.parse(store.get(dayKey()) || '{"n":0,"m":0}'); } catch (e) { return { n: 0, m: 0 }; } }
  function tRender() {
    var dur = tDur(), frac = dur ? T.left / dur : 0;
    $('#chipText').textContent = tFmt(T.left);
    $('#tBig').textContent = tFmt(T.left);
    $('#chipRing').setAttribute('stroke-dashoffset', String(RING * (1 - frac)));
    var chip = $('#timerChip');
    chip.classList.toggle('on', T.running);
    chip.dataset.mode = T.mode;
    $('#chipMode').textContent = T.mode === 'focus' ? tr('timer_focus') : tr('timer_break');
    $('#tMode').textContent = T.mode === 'focus' ? tr('t_session_focus') : tr('t_session_break');
    $('#tToggle').textContent = T.running ? tr('t_pause') : (T.left < dur ? tr('t_resume') : tr('t_start'));
    var st = dayStats();
    $('#tStats').textContent = st.n ? tr('stats_today', { n: st.n, m: st.m }) : tr('stats_none');
    var m = $('#tMsg');
    if (T.msg) { m.textContent = tr(T.msg, { m: T.brk }); m.hidden = false; } else { m.hidden = true; }
  }
  function ensureAudio() {
    try {
      if (!T.ctx) T.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (T.ctx.state === 'suspended') T.ctx.resume();
    } catch (e) { /* audio unavailable */ }
  }
  function beep() {
    try {
      ensureAudio(); var c = T.ctx; if (!c) return;
      [0, 0.28, 0.56].forEach(function (d, i) {
        var o = c.createOscillator(), g = c.createGain(); o.frequency.value = i === 2 ? 880 : 660;
        o.connect(g); g.connect(c.destination);
        var t0 = c.currentTime + d;
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
        o.start(t0); o.stop(t0 + 0.25);
      });
    } catch (e) { /* audio unavailable */ }
  }
  function tStart() { ensureAudio(); hideMsg(); T.endsAt = Date.now() + T.left * 1000; T.running = true; clearInterval(T.iv); T.iv = setInterval(tTick, 250); tRender(); }
  function tPause() { T.left = Math.max(0, Math.ceil((T.endsAt - Date.now()) / 1000)); T.running = false; clearInterval(T.iv); tRender(); }
  function tTick() {
    T.left = Math.max(0, Math.ceil((T.endsAt - Date.now()) / 1000));
    if (T.left <= 0) tDone();
    tRender();
  }
  function tDone() {
    clearInterval(T.iv); T.running = false; beep();
    if (T.mode === 'focus') {
      var st = dayStats(); st.n++; st.m += T.focus; store.set(dayKey(), JSON.stringify(st));
      T.msg = 'msg_focus_done'; T.mode = 'break';
    } else { T.msg = 'msg_break_done'; T.mode = 'focus'; }
    T.left = tDur();
    if ($('#timerPanel').hidden) $('#timerChip').classList.add('alert');
  }
  function hideMsg() { T.msg = ''; $('#tMsg').hidden = true; $('#timerChip').classList.remove('alert'); }
  function tSetDurations(f, b, stop) {
    T.focus = Math.min(180, Math.max(1, f || T.focus)); T.brk = Math.min(60, Math.max(1, b || T.brk));
    $('#tFocus').value = T.focus; $('#tBreak').value = T.brk;
    if (stop) { clearInterval(T.iv); T.running = false; }
    if (!T.running) T.left = tDur();
    tRender();
  }
  function openPanel(open) {
    var p = $('#timerPanel'), chip = $('#timerChip');
    p.hidden = !open; chip.setAttribute('aria-expanded', String(open));
    if (open) chip.classList.remove('alert');
  }
  $('#timerChip').addEventListener('click', function () { openPanel($('#timerPanel').hidden); });
  $('#tToggle').addEventListener('click', function () { if (T.running) tPause(); else tStart(); });
  $('#tReset').addEventListener('click', function () { clearInterval(T.iv); T.running = false; T.left = tDur(); hideMsg(); tRender(); });
  $('#tSkip').addEventListener('click', function () { clearInterval(T.iv); T.running = false; T.mode = T.mode === 'focus' ? 'break' : 'focus'; T.left = tDur(); hideMsg(); tRender(); });
  $('#tFocus').addEventListener('change', function (e) { tSetDurations(parseInt(e.target.value, 10), 0, false); });
  $('#tBreak').addEventListener('change', function (e) { tSetDurations(0, parseInt(e.target.value, 10), false); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
    b.addEventListener('click', function () { var p = b.dataset.preset.split(','); T.mode = 'focus'; hideMsg(); tSetDurations(parseInt(p[0], 10), parseInt(p[1], 10), true); });
  });

  /* ---------- boot ---------- */
  function boot() {
    LANG = detectLang();
    applyStatic();
    initTheme();
    var saved = store.get('sp:pack'), done = false;
    if (saved) {
      try {
        var r = spNormalise(JSON.parse(saved));
        if (r.pack) { setPack(r.pack, false); done = true; }
      } catch (e) { /* fall back to the example */ }
    }
    if (!done) setPack(sampleFor(LANG), true);
    tRender(); render();
  }
  boot();
})();

</script>

</body></html>
